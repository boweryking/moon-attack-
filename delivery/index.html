<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dash Delivery</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2236; font-family: system-ui, sans-serif; color: #fff; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 10px; pointer-events: none; }
    .card { background: rgba(0, 0, 0, 0.45); padding: 8px 12px; border-radius: 10px; min-width: 110px; }
    .label { font-size: 11px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.08em; }
    .val { font-size: 22px; font-weight: 700; }
    .bar { height: 8px; background: rgba(255, 255, 255, 0.2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
    .bar > div { height: 100%; width: 100%; transition: width 0.15s; }
    #healthBar > div { background: #ff5a5a; }
    #foodBar > div { background: #ffc233; }
    #msg { position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; font-weight: 800; text-shadow: 0 2px 8px #000; pointer-events: none; opacity: 0; transition: opacity 0.2s; white-space: nowrap; }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 12, 20, 0.7); }
    #panel { text-align: center; max-width: 460px; padding: 24px; line-height: 1.5; }
    #panel h1 { margin: 0 0 12px; font-size: 34px; }
    #panel p { opacity: 0.9; margin: 8px 0; }
    #panel .hint { font-size: 13px; opacity: 0.7; }
    button { margin-top: 12px; font-size: 20px; padding: 12px 28px; border: 0; border-radius: 10px; background: #ff5a1f; color: #fff; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="card"><div class="label">Score</div><div class="val" id="score">0</div></div>
    <div class="card"><div class="label">Combo</div><div class="val" id="combo">x1</div></div>
    <div class="card"><div class="label">Order time</div><div class="val" id="time">0</div></div>
    <div class="card"><div class="label">To drop-off</div><div class="val" id="dist">-</div></div>
    <div class="card" style="min-width: 160px;">
      <div class="label">Health</div>
      <div class="bar" id="healthBar"><div></div></div>
      <div class="label" style="margin-top: 8px;">Food temp</div>
      <div class="bar" id="foodBar"><div></div></div>
    </div>
  </div>

  <div id="msg"></div>

  <div id="overlay">
    <div id="panel"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
