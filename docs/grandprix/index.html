<script>
'use strict';
const W = 480, H = 800, TAU = Math.PI * 2, HZ = 300;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;

/* ---------- audio (synth) ---------- */
let AC = null, master = null, muted = false, eng = null;
function audio() {

function tone(f, d, type, v, slide, when) {

const SFX = {
  crash() { noise(.35, .35, 200); tone(110, .3, 'sawtooth', .22, -60); },
  bonk() { noise(.2, .25, 300); tone(200, .2, 'square', .2, -150); tone(90, .3, 'sawtooth', .2, -40, .05); },
  cone() { noise(.12, .22, 1200); tone(300, .08, 'square', .12, -100); },
  horn() { if (SND.s_horn_c) sfxPlay(Math.random() < .5 ? 'horn_c' : 'horn_b', .5); else { tone(392, .35, 'sawtooth', .1); tone(494, .35, 'sawtooth', .08); } },
  beep() { tone(660, .15, 'square', .18); }, go() { tone(990, .45, 'square', .2); },
  check() { [660, 880, 1320].forEach((f, i) => tone(f, .18, 'square', .15, 0, i * .09)); },
  win() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .25, 'square', .15, 0, i * .1)); },
  lose() { [392, 349, 311, 262].forEach((f, i) => tone(f, .4, 'triangle', .22, -30, i * .22)); },

let siren = null, hum = null, nextHonk = 6;
function startCityAudio() {
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter(); o.type = 'triangle'; f.type = 'lowpass'; f.frequency.value = 1800; g.gain.value = 0; o.connect(f); f.connect(g);

function cityAudio(dt) {

/* recorded music + voices */

let musicSrc = null, musicGain = null, musicName = null, voiceSrc = null, vq = [], caption = null, said = {}, lastSmash = -99;
const SN = ['s_horn_a', 's_horn_b', 's_horn_c', 's_tbone', 's_light'];
function sfxPlay(n, v, pan) { if (!AC || muted || !SND['s_' + n]) return; const src = AC.createBufferSource(), g = AC.createGain(); src.buffer = SND['s_' + n]; g.gain.value = v == null ? .6 : v; src.connect(g); let out = g; if (pan && AC.createStereoPanner) { const pn = AC.createStereoPanner(); pn.pan.value = clamp(pan, -1, 1); g.connect(pn); out = pn; } out.connect(master); src.start(); }

function talk(n, force) {

    const n = vq[0], b = SND['v_' + n]; if (b === undefined) return; vq.shift(); if (!b) continue;

// music (synth fallback until the recorded track loads): funky bass and arp, in A minor pentatonic
let musicOn = false, nextT = 0, step = 0;

/* ---------- areas ---------- */

let area = AREAS[0];

let segments = [], trackLength = 0, zone = 'mid';

const straight = n => addRoad(n, n, n, 0, 0);
function buildTrack() {

}
