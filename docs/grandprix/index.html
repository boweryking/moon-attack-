<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Grand Prix Racer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
html,body{margin:0;height:100%;background:#05030f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#05030f}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
'use strict';
const W = 480, H = 800, TAU = Math.PI * 2, HZ = 300;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W * 2; cv.height = H * 2;
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;

/* ---------- audio (synth) ---------- */
let AC = null, master = null, muted = false, eng = null;
function audio() {

}
function tone(f, d, type, v, slide, when) {
  if (!AC || muted) return; const t = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);

}
function noise(d, v, hp) {
  if (!AC || muted) return; const n = AC.sampleRate * d | 0, b = AC.createBuffer(1, n, AC.sampleRate), a = b.getChannelData(0); for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 600; g.gain.value = v || .2; s.buffer = b; s.connect(f); f.connect(g); g.connect(master); s.start();
}
const SFX = {
  crash() { noise(.35, .35, 200); tone(110, .3, 'sawtooth', .22, -60); },
  bonk() { noise(.2, .25, 300); tone(200, .2, 'square', .2, -150); tone(90, .3, 'sawtooth', .2, -40, .05); },
  cone() { noise(.12, .22, 1200); tone(300, .08, 'square', .12, -100); },
  horn() { tone(392, .35, 'sawtooth', .1); tone(494, .35, 'sawtooth', .08); },
  beep() { tone(660, .15, 'square', .18); }, go() { tone(990, .45, 'square', .2); },
  check() { [660, 880, 1320].forEach((f, i) => tone(f, .18, 'square', .15, 0, i * .09)); },
  win() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .25, 'square', .15, 0, i * .1)); },
  lose() { [392, 349, 311, 262].forEach((f, i) => tone(f, .4, 'triangle', .22, -30, i * .22)); },
  near() { tone(1200, .06, 'triangle', .06, 400); }
};
function startEngine() {
  const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter(); o.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0;
  o.connect(f); o2.connect(f); f.connect(g); g.connect(master); o.start(); o2.start(); eng = { o, o2, g, f };
}
function engineUpdate() {
  if (!eng || !AC) return; const run = (state === 'race' || state === 'count') && !muted, sp = speed / MAXS, t = AC.currentTime;
  const fr = 48 + sp * 170 + (input.throttle > .5 ? 8 : 0);
  eng.o.frequency.setTargetAtTime(fr, t, .05); eng.o2.frequency.setTargetAtTime(fr * .5, t, .05); eng.f.frequency.setTargetAtTime(380 + sp * 900, t, .05);
  eng.g.gain.setTargetAtTime(run ? .035 + sp * .05 : 0, t, .1);
}
// music: funky bass and arp, in A minor pentatonic
let musicOn = false, nextT = 0, step = 0;
const BASS = [110, 110, 165, 110, 131, 110, 147, 98], ARP = [440, 523, 659, 523, 587, 523, 659, 784];
function startMusic() { if (musicOn) return; musicOn = true; nextT = AC.currentTime + .1; setInterval(sched, 100); }
function sched() {
  if (!AC || muted || (state !== 'race' && state !== 'count' && state !== 'title')) { if (AC) nextT = Math.max(nextT, AC.currentTime); return; }
  const sp = state === 'race' ? .16 - Math.min(.04, speed / MAXS * .04) : .2;
  while (nextT < AC.currentTime + .3) {
    const t = nextT;
    const b = AC.createOscillator(), bg = AC.createGain(); b.type = 'sawtooth'; b.frequency.value = BASS[step % 8]; bg.gain.setValueAtTime(.05, t); bg.gain.exponentialRampToValueAtTime(.001, t + sp * .9); const bf = AC.createBiquadFilter(); bf.type = 'lowpass'; bf.frequency.value = 500; b.connect(bf); bf.connect(bg); bg.connect(master); b.start(t); b.stop(t + sp);
    if (step % 2 === 1) { const a = AC.createOscillator(), ag = AC.createGain(); a.type = 'square'; a.frequency.value = ARP[(step >> 1) % 8]; ag.gain.setValueAtTime(.03, t); ag.gain.exponentialRampToValueAtTime(.001, t + sp * .8); a.connect(ag); ag.connect(master); a.start(t); a.stop(t + sp); }
    if (step % 2 === 0) { const n = AC.sampleRate * .03 | 0, bf2 = AC.createBuffer(1, n, AC.sampleRate), d = bf2.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = AC.createBufferSource(), ng = AC.createGain(); ng.gain.value = .035; s.buffer = bf2; s.connect(ng); ng.connect(master); s.start(t); }
    nextT += sp; step++;

}

/* ---------- areas ---------- */
const AREAS = [
  { name: 'NEW YORK CITY', sub: 'Midtown Grand Prix', sky: ['#05030f', '#1a0f3e', '#5a2a6a'], fog: '#3a1f5a', road: ['#2b2b3a', '#252533'], side: ['#16162a', '#1c1c34'], curb: ['#ffd93b', '#1a1a2a'], lane: '#ffe9a0', start: 40, bonus: 25, segs: 4000, tint: '#ffd93b' }
];
let area = AREAS[0];

/* ---------- track ---------- */
const SL = 200, RW = 2000, LANES = 3, CAMH = 1000, FOV = 100, DRAW = 170, MAXS = SL * 60, CD = 1 / Math.tan(FOV / 2 * Math.PI / 180), PZ = CAMH * CD;
const ACC = MAXS / 5, BRK = MAXS * 1.1, DEC = MAXS / 6, OFFDEC = MAXS / 2, OFFLIM = MAXS / 4, CENT = .3;
let segments = [], trackLength = 0, zone = 'mid';
const easeIn = (a, b, p) => a + (b - a) * p * p, easeOut = (a, b, p) => a + (b - a) * (1 - (1 - p) * (1 - p)), easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + .5);

function addSeg(curve, y) { const n = segments.length; segments.push({ index: n, p1: { world: { y: lastY(), z: n * SL }, camera: {}, screen: {} }, p2: { world: { y, z: (n + 1) * SL }, camera: {}, screen: {} }, curve, sprites: [], cars: [], peds: [], zone, cross: false, finish: false }); }
function addRoad(enter, hold, leave, curve, y) {
  const sy = lastY(), ey = sy + y * SL, total = enter + hold + leave;
  for (let i = 0; i < enter; i++) addSeg(easeIn(0, curve, i / enter), easeInOut(sy, ey, i / total));
  for (let i = 0; i < hold; i++) addSeg(curve, easeInOut(sy, ey, (enter + i) / total));
  for (let i = 0; i < leave; i++) addSeg(easeInOut(curve, 0, i / leave), easeInOut(sy, ey, (enter + hold + i) / total));
}
const straight = n => addRoad(n, n, n, 0, 0);
function buildTrack() {
  segments = []; zone = 'mid';
  straight(14);                                     // start
  addRoad(20, 30, 20, 2, 0); straight(16);          // avenue bend
  addRoad(20, 40, 20, -3, 0); addRoad(30, 20, 30, 0, 14); // right-left, hill
  straight(18); addRoad(20, 24, 20, 3.5, -10);
  addRoad(16, 20, 16, -2, 0); straight(20);
  zone = 'park'; addRoad(24, 40, 24, 3, 6); straight(20); addRoad(24, 40, 24, -3.5, -6); addRoad(14, 14, 14, 2, 0); straight(24);
  zone = 'bridge'; addRoad(30, 30, 30, 0, 22); addRoad(30, 40, 30, 0, -22); addRoad(20, 30, 20, 2, 0); addRoad(20, 30, 20, -2, 0); straight(18);
  zone = 'mid'; addRoad(20, 28, 20, 4, 0); addRoad(20, 28, 20, -4, 0); straight(16); addRoad(26, 30, 26, 0, 12); addRoad(26, 30, 26, 0, -12);
  addRoad(18, 24, 18, 3, 0); straight(22); addRoad(18, 24, 18, -3, 0);
  while (segments.length < area.segs - 60) addRoad(16, 24, 16, (Math.random() < .5 ? -1 : 1) * (1 + Math.random() * 3), 0);
  straight(20);
  trackLength = segments.length * SL;
  // checkpoint / finish markers
  const n = segments.length;
  segments[Math.floor(n / 3)].sprites.push({ type: 'gantry', offset: 0, w: RW * 2.3, label: 'CHECKPOINT' });
  segments[Math.floor(n * 2 / 3)].sprites.push({ type: 'gantry', offset: 0, w: RW * 2.3, label: 'CHECKPOINT' });
  segments[n - 22].sprites.push({ type: 'gantry', offset: 0, w: RW * 2.3, label: 'FINISH' });
  segments[3].sprites.push({ type: 'gantry', offset: 0, w: RW * 2.3, label: 'GO!' });
  for (let k = n - 24; k < n - 20; k++) segments[k].finish = true;
  decorate();
}
function decorate() {
  const n = segments.length, rnd = (a, b) => a + Math.random() * (b - a);
  for (let i = 8; i < n; i++) {
    const s = segments[i];
    if (s.zone === 'mid') {
      if (i % 4 === 0) for (const side of [-1, 1]) { const w = rnd(2200, 4200), asp = rnd(1.2, 4.2); s.sprites.push({ type: 'building', offset: side * (1.28 + w / 4000 / 1 + rnd(0, .12)), w, asp, seed: (i * 7 + (side > 0 ? 3 : 0)) | 0, hue: [185, 300, 50, 150, 25][(i >> 2) % 5] }); }
      if (i % 12 === 6) for (const side of [-1, 1]) s.sprites.push({ type: 'lamp', offset: side * 1.16, w: 160, solid: true });
    } else if (s.zone === 'park') {
      if (i % 3 === 0) for (const side of [-1, 1]) s.sprites.push({ type: 'tree', offset: side * (1.5 + rnd(0, 1.6)), w: rnd(1100, 1900), seed: i });
      if (i % 12 === 6) for (const side of [-1, 1]) s.sprites.push({ type: 'lamp', offset: side * 1.16, w: 160, solid: true });
      if (i % 9 === 0) for (const side of [-1, 1]) s.sprites.push({ type: 'building', offset: side * 5.2, w: 3800, asp: rnd(2, 4), seed: i, hue: 200 });
    } else {
      if (i % 40 === 20) for (const side of [-1, 1]) s.sprites.push({ type: 'tower', offset: side * 1.5, w: 900 });
      if (i % 5 === 0) for (const side of [-1, 1]) s.sprites.push({ type: 'rail', offset: side * 1.16, w: 160, solid: true });
      if (i % 10 === 3) for (const side of [-1, 1]) s.sprites.push({ type: 'building', offset: side * 7, w: 3600, asp: rnd(2.5, 5), seed: i, hue: 185 });
    }
  }

  let nextCross = 90;
  for (let i = nextCross; i < n - 90; i += Math.floor(rnd(70, 120))) {
    const s = segments[i]; if (s.zone === 'bridge') continue;
    for (let k = 0; k < 2; k++) segments[i + k].cross = true;
    const cnt = 2 + Math.floor(Math.random() * 3);
    for (let k = 0; k < cnt; k++) { const dir = Math.random() < .5 ? 1 : -1; s.peds.push({ x: -dir * (1.3 + k * .22), dir, sp: rnd(.22, .42), state: 'wait', t: Math.random() * 6, hit: 0, hue: [10, 190, 300, 60, 140][k % 5], z: i * SL + 80 }); }
  }
  for (let i = 120; i < n - 100; i += Math.floor(rnd(45, 90))) {
    const s = segments[i]; if (s.cross || s.zone === 'bridge') continue; const lane = [-.66, 0, .66][Math.floor(Math.random() * 3)];

    const c = { z, offset: [-.66, 0, .66][Math.floor(Math.random() * 3)], speed: rnd(MAXS * .12, MAXS * .42), kind, w: kind === 'bus' ? 1000 : 780, seg: null, passed: false, hue: Math.floor(rnd(0, 360)) };

let cars = [];
const findSeg = z => segments[clamp(Math.floor(z / SL), 0, segments.length - 1)];

/* ---------- state ---------- */
let state = 'title', stateT = 0, t0 = 0;
let position = 0, speed = 0, playerX = 0, timeLeft = 0, msgs = [], shake = 0, crashT = 0, score = 0, passed = 0, skyOff = 0, bounce = 0, hi = 0, cpHit = {}, stats = {};
try { hi = +localStorage.getItem('gprHi') || 0; } catch (e) {}
const input = { steer: 0, throttle: 0, brake: 0 };
const stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * HZ, r: Math.random() * 1.3 + .3, p: Math.random() * 6 }));
const skyline = [];
(function () { let x = 0; while (x < 1100) { const w = 24 + Math.random() * 38; skyline.push({ x, w, h: 24 + Math.random() * 90, tall: Math.random() < .12 }); x += w * .8; } })();

function startRace() {
  area = AREAS[0]; buildTrack(); position = 0; speed = 0; playerX = 0; timeLeft = area.start; score = 0; passed = 0; msgs = []; cpHit = {}; crashT = 0; stats = { crashes: 0, peds: 0 };
  state = 'count'; stateT = 0; countN = 4;
}
let countN = 4;
function say(s, col, d) { msgs.push({ s, col: col || '#fff', t: d || 1.6, d: d || 1.6 }); if (msgs.length > 3) msgs.shift(); }

/* ---------- input ---------- */
let drag = null, keys = {};
function toL(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
function tapAction() { audio(); if (state === 'title') startRace(); else if ((state === 'finish' || state === 'over') && stateT > 1.2) { state = 'title'; stateT = 0; } }
addEventListener('pointerdown', e => {
  e.preventDefault(); audio(); const [lx, ly] = toL(e);
  if (lx > W - 52 && ly < 46) { muted = !muted; if (master) master.gain.value = muted ? 0 : .6; return; }
  if (state === 'race' || state === 'count') { if (!drag) drag = { id: e.pointerId, x0: lx, y0: ly }; } else tapAction();
}, { passive: false });
addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return; const [lx, ly] = toL(e);
  let dx = lx - drag.x0; const dy = ly - drag.y0;
  if (Math.abs(dx) > 90) { drag.x0 += dx - Math.sign(dx) * 90; dx = Math.sign(dx) * 90; }
  drag.dx = dx; drag.dy = dy;
});
const up = e => { if (drag && e.pointerId === drag.id) drag = null; };
addEventListener('pointerup', up); addEventListener('pointercancel', up); addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); tapAction(); } if (e.key === 'm' || e.key === 'M') { muted = !muted; if (master) master.gain.value = muted ? 0 : .6; } });
addEventListener('keyup', e => { keys[e.key] = false; });
function readInput() {
  let st = 0, th = 0, br = 0, cruise = false;
  if (drag) { st = clamp((drag.dx || 0) / 40, -1, 1); const dy = drag.dy || 0; if (dy < -22) th = 1; else if (dy > 22) br = clamp((dy - 22) / 30, .3, 1); else cruise = true; }
  if (keys.ArrowLeft || keys.a || keys.A) st = -1; if (keys.ArrowRight || keys.d || keys.D) st = 1;
  if (keys.ArrowUp || keys.w || keys.W) th = 1; if (keys.ArrowDown || keys.s || keys.S) br = 1;
  if (G.auto) { th = 1; st = autoSteer(); }
  input.steer = st; input.throttle = th; input.brake = br; input.cruise = cruise;
}
function autoSteer() { const ps = findSeg(position + PZ); let want = 0; for (let k = 0; k < 6; k++) { const s = segments[Math.min(segments.length - 1, ps.index + k * 2)]; for (const p of s.peds) if (Math.abs(p.x - playerX) < .45) want = p.x > playerX ? -1 : 1; for (const c of s.cars) if (Math.abs(c.offset - playerX) < .45) want = c.offset > playerX ? -1 : 1; for (const sp of s.sprites) if (sp.obs && Math.abs(sp.offset - playerX) < .4) want = sp.offset > playerX ? -1 : 1; } return want || clamp(-playerX * 1.5 + ps.curve * .12, -1, 1); }

/* ---------- update ---------- */
const overlap = (x1, w1, x2, w2) => !((x1 + w1 / 2) < (x2 - w2 / 2) || (x1 - w1 / 2) > (x2 + w2 / 2));
function update(dt) {

    const n = Math.ceil(3.2 - stateT); if (n !== countN && n >= 0) { countN = n; if (n > 0) SFX.beep(); else SFX.go(); }

  if (state === 'race' || state === 'finish' || state === 'over') moveWorld(dt);

    timeLeft -= dt; if (timeLeft <= 0) { timeLeft = 0; state = 'over'; stateT = 0; SFX.lose(); if (score > hi) { hi = score; try { localStorage.setItem('gprHi', hi); } catch (e) {} } }

function moveWorld(dt) {

    if (p.hit > 0) { p.hit += dt; p.x += p.dir * 1.2 * dt; }
  }

  const god = G.god;
  // collisions: cars
  const pw = .3;
  for (let k = 0; k < 2; k++) {
    const sg = segments[Math.min(segments.length - 1, ps.index + k)];
    for (const c of sg.cars) {
      if (speed > c.speed && overlap(playerX, pw, c.offset, c.w / RW * .5 + .1, 1)) { if (!god) { speed = c.speed * (c.speed / speed) * .8; position = Math.max(0, c.z - PZ - 20); if (crashT <= 0) { crashT = 1; shake = 12; stats.crashes++; SFX.crash(); say('CRASH!', '#ff4d6a'); timeLeft -= 1.5; } } break; }

    }

    }
