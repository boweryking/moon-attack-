<!DOCTYPE html>

<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }

    width:min(100vw, calc((100vh - 34px) * 4 / 3)); width:min(100vw, calc((100dvh - 34px) * 4 / 3)); height:auto; aspect-ratio:4/3; }
  /* Key guide under the game, desktop only (phones have labeled buttons instead). */
  #keys { height:34px; display:flex; justify-content:center; align-items:center; gap:clamp(8px, 1.2vw, 18px); white-space:nowrap; overflow:hidden;
    font:600 min(13px, 1.05vw)/1 "Courier New", monospace; color:#7f90bd; background:#000; }
  #keys b { color:#cfeaff; font-weight:700; border:1px solid #3b4d86; border-radius:5px; padding:3px 6px; margin-right:4px; background:#0b1230; box-shadow:0 1px 0 #1a2550; }
  #keys b + b { margin-left:-1px; }
  body.touch #keys { display:none; }
  body.touch canvas { width:min(100vw, calc(100vh * 4 / 3)); width:min(100vw, calc(100dvh * 4 / 3)); }
  @media (pointer: coarse) { #keys { display:none; } canvas { width:min(100vw, calc(100vh * 4 / 3)); width:min(100vw, calc(100dvh * 4 / 3)); } }

  :root { --u: clamp(54px, 17dvh, 108px); }
  #pads { display:none; position:fixed; inset:0; z-index:5; pointer-events:none; }
  body.playing #pads { display:block; }
  .pad { position:absolute; pointer-events:auto; touch-action:none; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:3px solid var(--c); background:var(--bg); box-shadow:0 0 14px var(--c); color:#fff; opacity:.88; padding:0; margin:0; }
  .pad.on { background:var(--c); box-shadow:0 0 28px var(--c), inset 0 0 18px rgba(255,255,255,.55); transform:scale(.94); opacity:1; }
  .pad svg { width:58%; height:58%; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;
    filter:drop-shadow(0 0 3px rgba(0,0,0,.7)); pointer-events:none; }
  .pad svg .f { fill:currentColor; }
  .pad .badge { position:absolute; top:-4px; right:-4px; min-width:1.5em; padding:0 .3em; border-radius:1em; background:#000c; border:2px solid var(--c);
    font:700 calc(var(--u) * .24)/1.4 "Courier New", monospace; text-align:center; pointer-events:none; }
  .pad.empty { opacity:.35; }
  .pad.listening { background:var(--c); box-shadow:0 0 22px var(--c), inset 0 0 14px rgba(255,255,255,.5); opacity:1; }
  .pad .eb { position:absolute; left:14%; right:14%; bottom:-9px; height:6px; border-radius:3px; background:#000a; border:1px solid var(--c); overflow:hidden; pointer-events:none; }
  .pad .eb b { display:block; height:100%; width:100%; background:#35e07a; }
  #mutePad .slash { display:none; } #mutePad.muted .slash { display:block; } #mutePad.muted .wave { display:none; }
  #padL { position:absolute; left:max(12px, env(safe-area-inset-left, 0px)); bottom:max(12px, 12dvh); width:calc(var(--u) * 2.3); height:calc(var(--u) * 2.35); }
  #padR { position:absolute; right:max(12px, env(safe-area-inset-right, 0px)); bottom:max(12px, 12dvh); width:calc(var(--u) * 2.9); height:calc(var(--u) * 2.75); }
  #padT { position:absolute; top:max(8px, env(safe-area-inset-top, 0px)); right:max(10px, env(safe-area-inset-right, 0px)); display:flex; gap:10px; pointer-events:none; }
  #padT .pad { position:static; width:calc(var(--u) * .62); height:calc(var(--u) * .62); }
  #bPad { left:0; bottom:0; width:calc(var(--u) * 1.05); height:calc(var(--u) * 1.05); }
  #tPad { left:calc(var(--u) * .62); top:0; width:calc(var(--u) * 1.1); height:calc(var(--u) * 1.1); }
  #lPad { left:0; bottom:0; width:calc(var(--u) * 1.05); height:calc(var(--u) * 1.05); }
  #rPad { right:0; bottom:0; width:calc(var(--u) * 1.05); height:calc(var(--u) * 1.05); }
  #fPad { right:0; bottom:0; width:calc(var(--u) * 1.65); height:calc(var(--u) * 1.65); }
  #sPad { left:0; bottom:0; width:calc(var(--u) * 1.05); height:calc(var(--u) * 1.05); }
  #gPad { left:calc(var(--u) * .3); top:0; width:calc(var(--u) * 1.1); height:calc(var(--u) * 1.1); }
  #wPad { right:calc(var(--u) * .4); top:calc(var(--u) * .1); width:calc(var(--u) * .78); height:calc(var(--u) * .78); }
  #rot { display:none; position:fixed; inset:0; z-index:10; background:#000; color:#9ef; text-align:center;
    align-items:center; justify-content:center; font:600 22px/1.5 "Courier New", monospace; padding:24px; }
  @media (orientation: portrait) and (pointer: coarse) { #rot { display:flex; } }

<body>
<canvas id="c" width="960" height="720"></canvas>
<div id="keys"><span><b>←</b><b>→</b>Rotate</span><span><b>↑</b>Thrust</span><span><b>Space</b>Fire</span><span><b>S</b>Shield (hold)</span><span><b>B</b>Grenade</span><span><b>H</b>Hyperspace</span><span><b>P</b>Pause</span><span><b>M</b>Mute</span><span><b>V</b>Voice</span><span><b>Enter</b>Start</span></div>
<div id="pads">
  <div id="padT">
    <button class="pad" id="voicePad" data-pad="voice" style="--c:#6f9;--bg:rgba(102,255,153,.20)" aria-label="Voice commands"><svg viewBox="0 0 24 24"><rect class="f" x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button>

  <div id="padL">
    <button class="pad" id="tPad" data-pad="thrust" style="--c:#ff8a1f;--bg:rgba(255,138,31,.30)" aria-label="Thrust"><svg viewBox="0 0 24 24"><path class="f" d="M12 3l8 10h-5v8H9v-8H4z"/></svg></button>
    <button class="pad" id="lPad" data-pad="left" style="--c:#3fb7ff;--bg:rgba(63,183,255,.26)" aria-label="Rotate left"><svg viewBox="0 0 24 24"><path class="f" d="M16 4L6 12l10 8z"/></svg></button>
    <button class="pad" id="rPad" data-pad="right" style="--c:#3fb7ff;--bg:rgba(63,183,255,.26)" aria-label="Rotate right"><svg viewBox="0 0 24 24"><path class="f" d="M8 4l10 8-10 8z"/></svg></button>
  </div>
  <div id="padR">
    <button class="pad" id="wPad" data-pad="hyper" style="--c:#b06cff;--bg:rgba(176,108,255,.28)" aria-label="Warp"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7.5a4.5 4.5 0 1 0 4.5 4.5"/><circle class="f" cx="12" cy="12" r="1.4"/></svg></button>
    <button class="pad" id="gPad" data-pad="bomb" style="--c:#f2c230;--bg:rgba(242,194,48,.28)" aria-label="Grenade"><svg viewBox="0 0 24 24"><circle cx="12" cy="14.5" r="6.5" class="f" fill-opacity=".35"/><path d="M9.5 8.5h5V5h-5z"/><path d="M14.5 5.5L19.5 4v3"/><circle cx="7.6" cy="4.8" r="2.1"/><path d="M8.2 12l7.2 7M15.8 12l-7.2 7"/></svg><span class="badge" id="bombN">2</span></button>
    <button class="pad" id="sPad" data-pad="shield" style="--c:#35e07a;--bg:rgba(53,224,122,.26)" aria-label="Shield"><svg viewBox="0 0 24 24"><path class="f" fill-opacity=".35" d="M12 3l8 3v6c0 4.5-3.5 8-8 9.5C7.5 20 4 16.5 4 12V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg><i class="eb"><b id="shE"></b></i></button>
    <button class="pad" id="fPad" data-pad="fire" style="--c:#ff3b3b;--bg:rgba(255,59,59,.30)" aria-label="Fire"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/><circle class="f" cx="12" cy="12" r="2"/></svg></button>
  </div>
</div>
<div id="rot">Turn your phone sideways to play.<br>Asteroids needs a wide screen.</div>
<script>
// ===== Classic Asteroids (vector style) =====
// Controls: ←/→ rotate, ↑ thrust, SPACE fire, H hyperspace, V voice commands, ENTER start, P pause, M mute
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, TAU = Math.PI * 2;

// ---------- Audio (tiny WebAudio synth) ----------
let actx = null, muted = false;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
function tone(freq, dur, type = 'square', vol = 0.08, slide = 0) {
  const a = audio(); if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
function noise(dur, vol = 0.15, freq = 800) {
  const a = audio(); if (!a || muted) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const synth = {
  fire: () => tone(880, 0.12, 'square', 0.06, -600),
  ufoFire: () => tone(500, 0.15, 'sawtooth', 0.05, -300),
  boom: size => noise(size === 3 ? 0.5 : size === 2 ? 0.3 : 0.18, 0.2, size === 3 ? 400 : size === 2 ? 800 : 1500),
  shipBoom: () => noise(1.0, 0.3, 600),
  thrust: () => noise(0.08, 0.05, 300),
  extra: () => { tone(660, 0.1); setTimeout(() => tone(990, 0.2), 100); },
  hyper: () => tone(200, 0.3, 'sine', 0.1, 800),
};
// ---------- Recorded audio (ElevenLabs) with synth fallback ----------
// Files live in ./audio/sfx and ./audio/voice. Anything missing quietly falls back to the synth.
const SFX_FILES = ['laser','thrust','boom_large','boom_medium','boom_small','ship_boom','ufo_loop','ufo_fire','ufo_boom',
  'hyperspace','extra_life','alarm','coin','game_over','shield','radio','space_ambience','shield_loop','shield_hit','shield_break','hull_hit','upgrade','grenade'];
const VOICE_FILES = ['story1','story2','story3','story4','ctrl_contact','ctrl_ship_lost','ctrl_last_ship','ctrl_cleared',
  'ctrl_unidentified','ctrl_extra_ship','ctrl_all_lost','ann_title','ann_incoming','ann_extra_life','ann_game_over',
  'ann_insert_coin','ann_high_score','ann_hyperspace','ann_accelerating','ann_pilot_down',
  'alien_world_ends','alien_we_see_you','alien_earth_ours','alien_impossible','ann_shields_up','ann_shields_down','ann_upgrade','ann_grenade',
  'fld_standard','fld_dense','fld_ice','fld_iron','fld_volatile','fld_gravity','fld_mother'];
// Clips load through Web Audio (fetch + decode). That works inside locked-down embedded pages and on iPhones, where the plain
// <audio> element is often blocked. If fetch isn't possible (opening the file straight from disk), it falls back to <audio>.
class WebClip { // acts like an <audio> element: play, pause, loop, volume, paused, ended, onended, cloneNode
  constructor(buf) { this.buf = buf; this.paused = true; this.ended = false; this.loop = false; this.onended = null; this._vol = 1; this._src = null; this._g = null; }
  get volume() { return this._vol; }
  set volume(v) { this._vol = v; if (this._g) this._g.gain.value = v; }
  cloneNode() { return new WebClip(this.buf); }
  play() {
    const a = audio(); if (!a || !this.buf) return Promise.resolve();
    this.pause(); const src = a.createBufferSource(), g = a.createGain();
    src.buffer = this.buf; src.loop = this.loop; g.gain.value = this._vol; src.connect(g).connect(a.destination);
    src.onended = () => { if (this._src !== src) return; this._src = null; this.paused = true; this.ended = true; if (this.onended) this.onended(); };
    this._src = src; this._g = g; this.paused = false; this.ended = false; src.start(); return Promise.resolve();
  }
  pause() { const s = this._src; this._src = null; if (s) { s.onended = null; try { s.stop(); } catch (e) {} } this.paused = true; }
}
const useWeb = typeof fetch === 'function' && location.protocol !== 'file:';
const clips = {};
function elClip(url) {
  const a = new Audio(url); a.preload = 'auto';
  a.addEventListener('canplaythrough', () => a._ok = true); a.addEventListener('error', () => a._bad = true);
  return a;
}
async function loadWeb(key, slot, url) {
  try {
    const r = await fetch(url); if (!r.ok) throw new Error(r.status);
    const ctx = audio(); if (!ctx) throw new Error('no audio');
    slot.buf = await ctx.decodeAudioData(await r.arrayBuffer()); slot._ok = true;
  } catch (e) { clips[key] = elClip(url); }
}
// Loading is lazy and throttled so the game never stalls: a few files at a time (one on phones), with a short breather between.
// Anything not loaded yet loads the first time it is needed (ensure), and the sound effects fall back to the synth until then.
const lite = matchMedia('(pointer: coarse)').matches; // phones and tablets get lighter loading
const loadQ = []; let loading = 0;
function pump() {
  while (loading < (lite ? 1 : 2) && loadQ.length) {
    const k = loadQ.shift(), sl = clips[k]; if (!(sl instanceof WebClip) || sl._ok || sl._started) continue;
    sl._started = true; loading++;
    loadWeb(k, sl, sl._url).finally(() => { loading--; setTimeout(pump, lite ? 120 : 20); });
  }
}
function ensure(key) { const sl = clips[key]; if (sl instanceof WebClip && !sl._ok && !sl._started) { loadQ.unshift(key); pump(); } }
function registerClip(key, url) {
  if (useWeb) { const sl = new WebClip(null); sl._ok = false; sl._started = false; sl._url = url; clips[key] = sl; }
  else clips[key] = elClip(url);
}
const PRIORITY = ['story1', 'laser', 'boom_small', 'boom_medium', 'boom_large', 'coin', 'thrust', 'story2', 'story3', 'story4', 'm_title',
  'ctrl_contact', 'ship_boom', 'radio', 'alarm', 'shield', 'shield_loop', 'shield_hit', 'shield_break', 'hull_hit', 'upgrade', 'fld_standard', 'm_wave_early'];
function startPrefetch() { // desktop: load everything in the background. phone: just the essentials, the rest on demand.
  const keys = lite ? PRIORITY : [...PRIORITY, ...Object.keys(clips).filter(k => !PRIORITY.includes(k))];
  for (const k of keys) if (clips[k] instanceof WebClip) loadQ.push(k);
  pump();
}
for (const [dir, list] of [['sfx', SFX_FILES], ['voice', VOICE_FILES]]) for (const n of list) registerClip(n, `audio/${dir}/${n}.mp3`);
function playClip(name, vol = 1) {
  const a = clips[name]; if (!a) return false; if (!a._ok) { ensure(name); return false; } if (muted) return false;
  const c = a.cloneNode(); c.volume = vol; c.play().catch(() => {}); return c;
}
const loops = {};
function loopSet(name, on, vol = 0.5) {
  const a = clips[name];
  if (!a || !a._ok) { if (a && on) ensure(name); if (name === 'thrust' && on && Math.random() < 0.5) synth.thrust(); return; }
  let l = loops[name]; if (!l) { l = loops[name] = a.cloneNode(); l.loop = true; l.volume = vol; }
  if (on && !muted) { if (l.paused) l.play().catch(() => {}); } else if (!l.paused) l.pause();
}
const sfx = {
  fire: () => playClip('laser', 0.45) || synth.fire(),
  ufoFire: () => playClip('ufo_fire', 0.6) || synth.ufoFire(),
  boom: s => playClip(s >= 3 ? 'boom_large' : s === 2 ? 'boom_medium' : 'boom_small', 0.8) || synth.boom(s),
  ufoBoom: () => playClip('ufo_boom', 0.8) || synth.boom(2),
  shipBoom: () => playClip('ship_boom', 1) || synth.shipBoom(),
  extra: () => playClip('extra_life', 0.8) || synth.extra(),
  hyper: () => playClip('hyperspace', 0.7) || synth.hyper(),
  alarm: () => playClip('alarm', 0.5),
  shield: () => playClip('shield', 0.5),
  shieldHit: () => playClip('shield_hit', 0.6) || tone(700, 0.12, 'sine', 0.08, -300),
  hullHit: () => playClip('hull_hit', 0.8) || synth.boom(1),
  upgrade: () => playClip('upgrade', 0.7) || synth.extra(),
  grenadeBlast: () => playClip('grenade', 0.9) || synth.boom(3),
  shieldBreak: () => playClip('shield_break', 0.8) || tone(400, 0.5, 'sawtooth', 0.08, -300),
  coin: () => playClip('coin', 0.8),
  gameOver: () => playClip('game_over', 0.8),
};
// Voice channel: one voice at a time; a new line only interrupts a lower-priority one. Always shows a subtitle.
let voice = null, voicePri = 0, subText = '', subT = 0;
function say(name, text, pri = 1) {
  if (voice && !voice.ended && !voice.paused && pri <= voicePri) return;
  if (voice) voice.pause();
  if (name.startsWith('ctrl_')) playClip('radio', 0.3);
  const c = playClip(name, 1); voice = c || null; voicePri = pri; subText = text;
  if (c) { subT = 60; c.onended = () => { if (voice === c) subT = 0.8; }; } else subT = 2 + text.length * 0.05;
}
// Opening story, spoken over deep-space ambience. Plays on its own timer if the voice files aren't there.
const STORY = [
  ['story1', 'The year is 2184. Beyond the orbit of Neptune, our deepest telescopes found something... moving in the dark.'],
  ['story2', 'A swarm. Ten thousand asteroids, tumbling out of the void... and every single one of them aimed at Earth.'],
  ['story3', 'There was no time to evacuate. No time to build a better defense. There was only one ship left in range. Yours.'],
  ['story4', 'Command has given you a name: the Last Line. Hold the field. Break the rock. Let nothing through. Earth is counting on you, pilot. Launch.'],
];
let st = { i: 0, t: 0, phase: 'gap', clip: null };
function startStory() { state = 'story'; st = { i: 0, t: 0, phase: 'gap', clip: null, min: 0 }; loopSet('space_ambience', true, 0.35); }
function endStory() { if (st.clip) st.clip.pause(); loopSet('space_ambience', false); fromRestart = false; newGame(); }
function updateStory(dt) {
  st.t += dt;
  if (st.phase === 'gap') {
    if (st.t > 1.0) { st.clip = playClip(STORY[st.i][0], 1); st.phase = 'speak'; st.t = 0; st.min = STORY[st.i][1].length * 0.065 + 1.5; }
  } else {
    const over = st.clip ? (st.clip.ended || st.t > 25) : st.t > st.min;
    if (over && st.t > 1.5) { st.i++; st.t = 0; st.phase = 'gap'; if (st.i >= STORY.length) endStory(); }
  }
}
function wrapText(str, x, y, maxW, lh, size) {
  ctx.font = `${size}px "Courier New", monospace`; ctx.textAlign = 'center';
  let line = '', row = 0; const lines = [];
  for (const w of str.split(' ')) { const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  lines.push(line); lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh));
}
function drawStory() {
  const entry = STORY[Math.min(st.i, STORY.length - 1)];
  ctx.globalAlpha = st.phase === 'speak' ? Math.min(1, st.t / 0.8) : Math.max(0, 1 - st.t / 0.4);
  wrapText(entry[1], W / 2, H / 2 - 40, W - 220, 36, 26);
  ctx.globalAlpha = 1; text(touchMode ? 'TAP TO SKIP' : 'SPACE / ENTER TO SKIP', W / 2, H - 40, 14);
}
function gameOverSeq() {
  state = 'over'; playClip('m_gameover', 0.7) || sfx.gameOver(); say('ann_game_over', 'Game over. The field claims another.', 3);
  const newHigh = score > 0 && score > startHi;
  setTimeout(() => { if (state !== 'over') return;
    if (newHigh) { playClip('m_victory', 0.7); say('ann_high_score', 'New high score!', 2); }
    else say('ctrl_all_lost', 'CONTROL: All ships lost. Control signing off. Goodbye, pilot.', 2); }, 3200);
  setTimeout(() => { if (state === 'over') say('ann_insert_coin', 'Insert coin.', 1); }, 11000);
}

// ---------- Music (ElevenLabs) — crossfades by wave, ducks under voices ----------
for (const n of ['title', 'wave_early', 'gameplay', 'between_waves', 'boss', 'gameover', 'victory']) {
  registerClip('m_' + n, `audio/music/${n}.mp3`);
}
startPrefetch();
let musicCur = null; const musicEls = {};
function musicPick() {
  if (state === 'story') return 'title';
  if (state === 'play' || state === 'pause') {
    if (!rocks.length && !ufo) return 'between_waves';

  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.restore();

  // screens and messages (not shaken)
  const hue = (t * 40) % 360, title = `hsl(${hue},100%,72%)`;
  if (state === 'title') {
    neon(title, 24); text('ASTEROIDS', W / 2, H / 2 - 60, 76);
    neon('#fff', 10); text(touchMode ? 'TAP ANYWHERE TO START' : 'PRESS ENTER OR SPACE TO START', W / 2, H / 2 + 10, 22);
    neon('#9ef', 6);
    if (touchMode) { text('LEFT THUMB: STEER AND THRUST', W / 2, H / 2 + 60, 16); text('RIGHT THUMB: FIRE (HOLD) \u00B7 SHIELD \u00B7 BOMB \u00B7 WARP', W / 2, H / 2 + 86, 16); }
    else { text('← → ROTATE   ↑ THRUST   SPACE FIRE   S SHIELD   B GRENADE   H HYPERSPACE', W / 2, H / 2 + 60, 16);
      text('P PAUSE   M MUTE   V VOICE COMMANDS   C CRT EFFECTS', W / 2, H / 2 + 86, 16); }
    if (touchMode && !standalone && location.hostname.endsWith('github.io')) { neon('#fd6', 6); text('TIP: SHARE > ADD TO HOME SCREEN FOR FULL SCREEN', W / 2, H / 2 + 130, 15); }
  } else if (state === 'over') {
    neon('#f55', 24); text('GAME OVER', W / 2, H / 2 - 10, 64);
    neon('#fff', 8); text(touchMode ? 'TAP TO PLAY AGAIN' : 'PRESS ENTER TO PLAY AGAIN', W / 2, H / 2 + 40, 20);
  } else if (state === 'story') { neon('#dff', 10); drawStory(); }
  else if (state === 'pause') { neon('#fff', 14); text('PAUSED', W / 2, H / 2, 48); neon('#9ef', 8); text(touchMode ? 'TAP THE PAUSE BUTTON TO RESUME' : 'PRESS P OR CLICK TO RESUME', W / 2, H / 2 + 40, 18); }
  else if (!rocks.length && !ufo && waveDelay > 0) { const nf = fieldFor(wave + 1); neon(FIELDS[nf].col || rc, 18); text('FIELD ' + (wave + 1) + '  -  ' + FIELDS[nf].name, W / 2, H / 2 + 40, 34); }
  if (state === 'play' && banner.t > 0) { ctx.globalAlpha = Math.min(1, banner.t); neon(FIELDS[field].col || rc, 16); text(banner.text, W / 2, 110, 26); ctx.globalAlpha = 1; }
  if (state === 'play' && upBanner.t > 0) { ctx.globalAlpha = Math.min(1, upBanner.t); neon('#fd6', 18); text(upBanner.text, W / 2, H / 2 - 20, 30); ctx.globalAlpha = 1; }
  if (subT > 0 && state !== 'story') { // voice subtitles
    ctx.globalAlpha = Math.min(1, subT * 2); neon('#9fd', 8);
    wrapText(subText, W / 2, H - 70, W - 200, 26, 20); ctx.globalAlpha = 1; }
  drawVoice();
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff';

  if (fx) {
    if (flash > 0) { ctx.globalAlpha = flash * 0.5; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    const band = ((t * 70) % (H + 240)) - 120; // slow rolling scan band
    const g = ctx.createLinearGradient(0, band - 60, 0, band + 60);
    g.addColorStop(0, 'rgba(160,220,255,0)'); g.addColorStop(0.5, 'rgba(160,220,255,0.035)'); g.addColorStop(1, 'rgba(160,220,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, band - 60, W, 120);
    ctx.drawImage(crt, 0, 0);
  }
}

// ---------- Loop ----------
// Demo field behind the title screen
ship = makeShip(); ship.alive = false; wave = 1; for (let i = 0; i < 6; i++) rocks.push(makeRock(rand(0, W), rand(0, H), 3));
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (state === 'play' && touchMode && innerHeight > innerWidth) state = 'pause'; // turned upright: pause
  if (state === 'play') update(dt);
  else {
    if (state === 'title' || state === 'over' || state === 'story') for (const r of rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.a += r.spin * dt; wrap(r); }
    if (state === 'story') updateStory(dt);
    if (state !== 'pause') { loopSet('thrust', false); loopSet('ufo_loop', false); loopSet('shield_loop', false); }
  }
  if (subT > 0 && subT < 50) subT -= dt;
  musicSet(musicPick()); musicTick(dt); starsTick(dt); updatePads();
  if ((voice && !voice.ended && !voice.paused) || (state === 'story' && st.clip && !st.clip.ended)) voiceQuietAt = performance.now() + 900;
  voiceNoteT -= dt; voiceHeardT -= dt;
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// Offline support (only where the browser allows it, i.e. the real website, not the embedded preview).
try { if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
</script>
