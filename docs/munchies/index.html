'use strict';

const T = 24, COLS = 19, ROWS = 21, OY = 56, W = COLS * T, H = OY + ROWS * T + 116, TAU = Math.PI * 2, TUN = 9;

// Rasta Dave: one line at a time, shown as a caption, and the music dips while he talks
let caption = '', captionT = 0;
const LINES = { intro: 'Wah gwaan, mon! Welcome to Munchies. Eat all de herb, mon. And mind de Paranoia dem!', hint: 'Swipe to steer, mon. Grab de big pipe, and de Paranoia turn green. Den you can chase dem!', start: "Irie! Let's go, mon!", pipe: 'Big up, mon! Now dem paranoid. Go catch dem!', eat1: 'Yeah mon!', eat2: 'Nice one, mon! One love!', pipeend: 'Watch out, mon! Dem coming back!', death: 'Ah, dem catch you, mon! Try again!', level: 'Irie! All de herb is gone. Next level, mon!', munch: 'Ah, de munchies, mon! Tasty!', last: 'Almost done, mon! Eat de last herb!', life: 'Bless up! Extra life, mon!', over: 'Game over, mon. No worries. One love. Come back soon!', chase: "Dem Paranoia dem, dem a chase you, mon! Don't let dem touch you!" };

}

// ---------- state
let state = 'title', score = 0, hi = 0, lives = 3, level = 1, time = 0, stateT = 0, nextLife = 10000, modeIdx = 0, modeT = 0, frightT = 0, chain = 0, eaten = 0, totalDots = 0, bonus = null, bonusShown = 0, seenPipe = false, saidHint = false, saidChase = false, saidLast = false, deathT = 0;

const MUNCH = [['🍕', 100], ['🍪', 300], ['🍔', 500], ['🍦', 700], ['🍩', 1000], ['🌮', 2000]];

// ---------- movement

// ---------- drawing
