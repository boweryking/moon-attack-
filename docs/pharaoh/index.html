/* ---------- audio (synth: tones + a little desert-mode loop) ---------- */
let AC = null, master = null, muted = false;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .6; master.connect(AC.destination); startMusic(); loadSnd(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); }

  if (!AC || muted) return; const t = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
  g.gain.setValueAtTime(v || .15, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .02);

function noise(d, v, hp) {

  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 800; g.gain.value = v || .2; s.buffer = b; s.connect(f); f.connect(g); g.connect(master); s.start();
}
const SFX = {
  paddle() { tone(300, .08, 'triangle', .22, 200); },
  wall() { tone(180, .05, 'triangle', .12); },
  brick(h) { tone(520 + h * 90 + Math.random() * 60, .07, 'square', .12); },
  crack() { tone(220, .09, 'sawtooth', .13, -80); },
  smash() { noise(.18, .22, 500); tone(160, .12, 'square', .1, -90); },
  scarab() { tone(900, .12, 'square', .13, 500); tone(1400, .1, 'square', .09, -300, .06); },
  zap() { noise(.15, .12, 3000); tone(300, .25, 'sawtooth', .14, -250); },
  pharaoh() { tone(110, .35, 'sawtooth', .22, -50); noise(.25, .2, 300); tone(660, .15, 'square', .1, -300, .05); },
  launch() { tone(250, .14, 'triangle', .2, 500); },
  lose() { tone(330, .5, 'sawtooth', .2, -260); tone(220, .7, 'square', .12, -150, .15); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .25, 'square', .14, 0, i * .11)); },

// music: D phrygian-dominant arpeggio over a drone
const SND = {}, PEND = {};
const LINES = { intro: 'Welcome, brave one. I am Cleopatra. Smash the pyramid, wake the Pharaoh, and bring his treasure home.', hint: 'Slide your paddle, and bounce the ball into the stones. Dig down to the Pharaoh!', giza: 'Giza. The great pyramid of Pharaoh Khufu. Break through his stones, and wake him.', karnak: 'Karnak! The temple of Ramesses the Great. Break down his gate, and beware his chariots.', saqqara: 'Saqqara. The stepped pyramid of Pharaoh Djoser. The stones are stronger here. Stay sharp.', philae: 'Philae. The temple of the boy king, Tutankhamun. His curse is strong. Be brave.', chariot: 'A chariot! Watch out for his bombs!', builders: 'The builders are mending the wall. Knock them down before they finish!', scarab: 'Scarabs! Do not let them touch your paddle!', stir: 'The Pharaoh stirs! Hit him again!', defeat: 'The Pharaoh is defeated! Magnificent!', careful: 'Careful, my friend. Try again.', over: 'The curse has won. But the Nile always returns. Try again.', harder: 'Another stage. The stones are harder now. Stay sharp.',

let musicSrc = null, musicGain = null, musicName = null, wantMusic = 'm_pyramid', voiceSrc = null, vq = [], caption = null, said = {};
function loadSnd(list) { (list || civFiles(CIVS[0])).forEach(n => { if (SND[n] !== undefined || PEND[n]) return; PEND[n] = 1; fetch('audio/' + n + '.mp3?v=1').then(r => r.arrayBuffer()).then(b => new Promise((ok, no) => AC.decodeAudioData(b, ok, no))).then(d => { SND[n] = d; if (n === wantMusic) playMusic(n); pumpVoice(); }).catch(() => { SND[n] = false; pumpVoice(); }); }); }
const musicVol = () => voiceSrc ? .16 : .5;
function playMusic(n) {
  wantMusic = n; if (!AC || !SND[n] || musicName === n) return;
  if (musicGain) { const og = musicGain, os = musicSrc; og.gain.cancelScheduledValues(AC.currentTime); og.gain.setTargetAtTime(0, AC.currentTime, .25); setTimeout(() => { try { os.stop(); } catch (e) {} }, 1200); }
  const src = AC.createBufferSource(), g = AC.createGain(); src.buffer = SND[n]; src.loop = true; g.gain.value = 0; src.connect(g); g.connect(master); src.start(); g.gain.setTargetAtTime(musicVol(), AC.currentTime, .4);

  else if (voiceSrc && vq.length > 1) return;
  vq.push(n); pumpVoice();
}
function sayOnce(n) { if (said[n]) return; said[n] = 1; say(n); }
function pumpVoice() {
  while (!voiceSrc && vq.length && AC && !muted) {
    const n = vq[0], b = SND['v_' + n]; if (b === undefined) return; vq.shift(); if (!b) continue;
    const src = AC.createBufferSource(), g = AC.createGain(); src.buffer = b; g.gain.value = 1.15; src.connect(g); g.connect(master);
    voiceSrc = src; caption = { s: LINES[n] || '', t: 0, d: b.duration }; duck(); src.onended = () => { if (voiceSrc === src) { voiceSrc = null; caption = null; duck(); pumpVoice(); } }; src.start();
  }
}
function areaIntro() { const A = areaOf(level); playMusic(A.music); if ((level - 1) % 2 === 0) { const l = civ.v.a[areaIdx(level)]; if (l) say(l); } else say(civ.v.harder); }

let musicOn = false, nextT = 0, step = 0;
const SCALE = [293.66, 311.13, 369.99, 392, 440, 466.16, 523.25, 587.33], PAT = [0, 2, 3, 2, 4, 3, 2, 1, 0, 2, 3, 5, 4, 3, 2, 1], BASS = [146.83, 146.83, 138.59, 146.83];

    const w = nextT - AC.currentTime;

    const o = AC.createOscillator(), g = AC.createGain(), t = nextT; o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.001, t + sp * .9); o.connect(g); g.connect(master); o.start(t); o.stop(t + sp);
    if (step % 4 === 0) { const b = AC.createOscillator(), bg = AC.createGain(); b.type = 'sine'; b.frequency.value = BASS[(step >> 2) % 4]; bg.gain.setValueAtTime(.12, t); bg.gain.exponentialRampToValueAtTime(.001, t + sp * 3.6); b.connect(bg); bg.connect(master); b.start(t); b.stop(t + sp * 4); }
    if (step % 8 === 4) { const n = AC.sampleRate * .05 | 0, bf = AC.createBuffer(1, n, AC.sampleRate), a = bf.getChannelData(0); for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = AC.createBufferSource(), ng = AC.createGain(); ng.gain.value = .05; s.buffer = bf; s.connect(ng); ng.connect(master); s.start(t); }

let civ = CIVS[0];
const areaIdx = l => ((l - 1) >> 1) % civ.areas.length, areaOf = l => civ.areas[areaIdx(l)];

/* ---------- state ---------- */

function newBall() { return { x: paddle.x, y: paddle.y - 8, vx: 0, vy: 0, r: 7, stuck: true, trail: [] }; }

function startGame() { level = 1; score = 0; lives = 3; paddle.w = 84; said = {}; buildLevel(); serve(); say(civ.v.intro, true); areaIntro(); let seen = 0; try { seen = localStorage.getItem('pharaohSeen'); localStorage.setItem('pharaohSeen', '1'); } catch (e) {} if (!seen && civ.v.hint) say(civ.v.hint); }
