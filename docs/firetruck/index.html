/* ================= top-down city ================= */

/* ================= game state ================= */

try { hi = +localStorage.getItem('frHi') || 0; } catch (e) {}
let countN = 4;
const input = { want: -1 }, stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * 300, r: Math.random() * 1.3 + .3, p: Math.random() * 6 }));

/* ================= input ================= */
let drag = null, keys = {}, aim = null;

}, { passive: false });

/* ================= update ================= */
