<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
'use strict';
const W = 480, H = 800, TAU = Math.PI * 2, HZ = 300;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W * 2; cv.height = H * 2;

addEventListener('resize', fit); fit();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, rnd = (a, b) => a + Math.random() * (b - a);

/* ================= audio ================= */
let AC = null, master = null, muted = false, eng = null, sirenO = null;
const SND = {}, PEND = {};
const VN = ['d_call0', 'd_call1', 'd_call2', 'd_hurry', 'c_go', 'c_clear', 'c_corner', 'c_wreck', 'c_arrive', 'c_spread', 'c_cat', 'c_dog', 'c_rescue', 'c_dry', 'c_two', 'c_three', 'c_out', 'c_lost', 'c_fail'];
const SN = ['s_airhorn', 's_meow', 's_bark', 's_glass', 's_crackle', 's_spray', 's_hiss'];
const LINES = {
  d_call0: 'Dispatch to Ladder Nine. Structure fire on Maple Street. All units respond. Code three!', d_call1: 'Dispatch to Ladder Nine. Apartment fire on Fifth Avenue, residents may be trapped. Respond code three!', d_call2: 'Dispatch to Ladder Nine. Warehouse fire down by Pier Nine, multiple buildings burning. Respond code three!', d_hurry: 'Ladder Nine, the fire is spreading fast! Step on it!',
  c_go: 'Let\'s roll, rookie! Lights and sirens!', c_clear: 'Clear the road! Fire truck coming through!', c_corner: 'Easy into the corner! This rig is long!', c_wreck: 'Watch the paint, rookie!', c_arrive: 'We\'re on scene! Charge the line and hit those flames!', c_spread: 'It\'s spreading! Hit the windows and knock it down!', c_cat: 'There\'s a cat in the window! Clear the fire and get her out!', c_dog: 'There\'s a dog up there! Knock the fire down and get him out!', c_rescue: 'Great save! That\'s one happy pet!', c_dry: 'Tank\'s dry! Hold on while we refill from the hydrant!', c_two: 'Two buildings burning! We have to hit them both!', c_three: 'Three buildings! Keep that hose moving, crew!', c_out: 'Fire\'s out! Great work, crew! All clear!', c_lost: 'We lost one. Next time, rookie.', c_fail: 'The building\'s gone. Stay sharp out there.'
};
let musicSrc = null, musicGain = null, voiceSrc = null, vq = [], caption = null, said = {}, loops = {};
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .6; master.connect(AC.destination); startEngine(); loadSnd(); } catch (e) {} }

}
function tone(f, d, type, v, slide, when) {
  if (!AC || muted) return; const t = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);

const SFX = {
  crash() { tone(110, .3, 'sawtooth', .22, -60); }, bump() { tone(180, .15, 'square', .18, -100); }, beep() { tone(660, .15, 'square', .18); }, go() { tone(990, .45, 'square', .2); },
  chime() { [784, 988, 1319].forEach((f, i) => tone(f, .22, 'triangle', .16, 0, i * .09)); }, win() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .25, 'square', .15, 0, i * .1)); }, lose() { [392, 349, 311, 262].forEach((f, i) => tone(f, .4, 'triangle', .22, -30, i * .22)); }
};
function loadSnd() { ['m_fire'].concat(SN, VN.map(n => 'v_' + n)).forEach(n => { if (PEND[n]) return; PEND[n] = 1; fetch('audio/' + n + '.mp3?v=1').then(r => r.arrayBuffer()).then(b => new Promise((ok, no) => AC.decodeAudioData(b, ok, no))).then(d => { SND[n] = d; if (n === 'm_fire') playMusic(); pumpVoice(); }).catch(() => { SND[n] = false; pumpVoice(); }); }); }

  l.g.gain.setTargetAtTime(muted ? 0 : vol, AC.currentTime, .08);
}
const musicVol = () => voiceSrc ? .15 : .42;
function playMusic() { if (!AC || !SND.m_fire || musicGain) return; const src = AC.createBufferSource(), g = AC.createGain(); src.buffer = SND.m_fire; src.loop = true; g.gain.value = 0; src.connect(g); g.connect(master); src.start(); g.gain.setTargetAtTime(musicVol(), AC.currentTime, .4); musicSrc = src; musicGain = g; }

function talk(n, force) {

function talkOnce(n, force) { if (said[n]) return; said[n] = 1; talk(n, force); }

    const src = AC.createBufferSource(), g = AC.createGain(); src.buffer = b; g.gain.value = 1.15; src.connect(g); g.connect(master);
    voiceSrc = src; caption = { s: LINES[n] || '', who: n[0] === 'd' ? 'DISPATCH' : 'CAPTAIN' }; duck(); src.onended = () => { if (voiceSrc === src) { voiceSrc = null; caption = null; duck(); pumpVoice(); } }; src.start();
  }
}
function setMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : .6; if (muted) { vq = []; if (voiceSrc) { try { voiceSrc.onended = null; voiceSrc.stop(); } catch (e) {} voiceSrc = null; caption = null; } } }
function startEngine() {
  const o = AC.createOscillator(), o2 = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter(); o.type = 'sawtooth'; o2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 400; g.gain.value = 0;
  o.connect(f); o2.connect(f); f.connect(g); g.connect(master); o.start(); o2.start(); eng = { o, o2, g, f };
  const s = AC.createOscillator(), sg = AC.createGain(); s.type = 'triangle'; sg.gain.value = 0; s.connect(sg); sg.connect(master); s.start(); sirenO = { s, g: sg };

function audioUpdate() {
  if (!eng || !AC) return; const t = AC.currentTime, driving = (state === 'drive' || state === 'count') && !muted, sp = speed / MAXS;
  const fr = 34 + sp * 120; eng.o.frequency.setTargetAtTime(fr, t, .06); eng.o2.frequency.setTargetAtTime(fr * .5, t, .06); eng.f.frequency.setTargetAtTime(260 + sp * 700, t, .06); eng.g.gain.setTargetAtTime(driving ? .045 + sp * .05 : 0, t, .1);

/* ================= road engine (pseudo-3D) ================= */
const SL = 200, RW = 2000, LANES = 3, CAMH = 1000, FOV = 100, DRAW = 170, MAXS = SL * 34, CD = 1 / Math.tan(FOV / 2 * Math.PI / 180), PZ = CAMH * CD;
const ACC = MAXS / 8, BRK = MAXS * 1.2, DEC = MAXS / 7, OFFDEC = MAXS / 2, OFFLIM = MAXS / 4, CENT = .5;
let segments = [], trackLength = 0, cars = [], lights = [], dropZ = null, NB = 1;

function addRoad(enter, hold, leave, curve, y) {
  const sy = lastY(), ey = sy + y * SL, total = enter + hold + leave;
  for (let i = 0; i < enter; i++) addSeg(easeIn(0, curve, i / enter), easeInOut(sy, ey, i / total));
  for (let i = 0; i < hold; i++) addSeg(curve, easeInOut(sy, ey, (enter + i) / total));

const straight = n => addRoad(n, n, n, 0, 0);
function buildTrack() {

  while (segments.length < target - 160) {

  dropZ = { start: n - 75, end: n - 30 }; for (let k = dropZ.start; k <= dropZ.end; k++) segments[k].mark = true;

function lightState(L, t) { const tc = (t + L.off) % 11; return tc < 5.2 ? 'g' : tc < 6.7 ? 'y' : 'r'; }

/* ================= game state ================= */
let state = 'title', stateT = 0, t0 = 0, level = 1, score = 0, hi = 0, shake = 0, msgs = [], driveTime = 0, fireLevel = 0, streak = 0;
try { hi = +localStorage.getItem('frHi') || 0; } catch (e) {}
let position = 0, speed = 0, playerX = 0, crashT = 0, bounce = 0, skyOff = 0, countN = 4, yielded = false, cornerSaid = false;
const input = { steer: 0, sS: 0, throttle: 0, brake: 0, cruise: false }, stars = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * HZ, r: Math.random() * 1.3 + .3, p: Math.random() * 6 }));

function say(s, col, d) { msgs.push({ s, col: col || '#fff', t: d || 1.6 }); if (msgs.length > 3) msgs.shift(); }
function startLevel() {

function startGame() { level = 1; score = 0; startLevel(); }

/* ================= input ================= */
let drag = null, keys = {}, aim = null;
function toL(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
addEventListener('pointerdown', e => {

  if (state === 'over' && stateT > 1.3) { state = 'title'; stateT = 0; return; }
  if (state === 'drive' || state === 'count') { if (!drag) drag = { id: e.pointerId, x0: lx, y0: ly }; else if (drag && state === 'drive') horn(); }
  if (state === 'scene') { aim = { id: e.pointerId, x: lx, y: ly - 64 }; }
}, { passive: false });
addEventListener('pointermove', e => {
  const [lx, ly] = toL(e);
  if (aim && e.pointerId === aim.id) { aim.x = lx; aim.y = ly - 64; }
  if (drag && e.pointerId === drag.id) { let dx = lx - drag.x0; const dy = ly - drag.y0; if (Math.abs(dx) > 90) { drag.x0 += dx - Math.sign(dx) * 90; dx = Math.sign(dx) * 90; } drag.dx = dx; drag.dy = dy; }
});
const up = e => { if (drag && e.pointerId === drag.id) drag = null; if (aim && e.pointerId === aim.id) aim = null; };
addEventListener('pointerup', up); addEventListener('pointercancel', up); addEventListener('contextmenu', e => e.preventDefault());

/* ================= update ================= */
const overlap = (x1, w1, x2, w2) => !((x1 + w1 / 2) < (x2 - w2 / 2) || (x1 - w1 / 2) > (x2 + w2 / 2));
function update(dt) {
  t0 += dt; stateT += dt; shake = Math.max(0, shake - dt * 30); crashT = Math.max(0, crashT - dt); for (const m of msgs) m.t -= dt; msgs = msgs.filter(m => m.t > 0);

function driveWorld(dt) {
