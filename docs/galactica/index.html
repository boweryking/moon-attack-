<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Galactica</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
html,body{margin:0;height:100%;background:#02030a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#02030a}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="1600"></canvas></div>
<script>
'use strict';
// ---------- Galactica: aliens swoop in, form up and dive-bomb. Capture beam, challenge stages, bosses and power-ups.
const W = 480, H = 800, cv = document.getElementById('c'), ctx = cv.getContext('2d'), TAU = Math.PI * 2;
ctx.scale(2, 2);
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();
const glow = (c, b) => { ctx.strokeStyle = c; ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = b; };

// ---------- audio: recorded sounds and music, with synth beeps as a fallback while they load
let AC = null, muted = false, master = null, musicGain = null, curMusic = null, wantMusic = null, loopSrc = {};
const SND = {}, NAMES = ['shoot', 'explode', 'boom', 'hit', 'eshot', 'dive', 'die', 'beam', 'capture', 'rescue', 'powerup', 'bomb', 'shield', 'stage', 'perfect', 'warning', 'bosshit', 'v_ready', 'v_challenge', 'v_perfect', 'v_boss', 'v_captured', 'v_rescued', 'v_over', 'v_bossdown', 'm_play', 'm_challenge', 'm_boss'];
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = .9; master.connect(AC.destination); musicGain = AC.createGain(); musicGain.gain.value = 0; musicGain.connect(master);
    NAMES.forEach(n => fetch('audio/' + n + '.mp3?v=1').then(r => r.arrayBuffer()).then(b => new Promise((res, rej) => AC.decodeAudioData(b, res, rej))).then(buf => { SND[n] = buf; if (n === wantMusic && !curMusic) playMusic(n); }).catch(() => {})); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function snd(n, vol = .8, rate = 1, loop = false) { if (!AC || muted || !SND[n]) return null; const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = SND[n]; s.loop = loop; s.playbackRate.value = rate; g.gain.value = vol; s.connect(g); g.connect(master); s.start(); s._g = g; return s; }
function playMusic(n) {
  wantMusic = n; if (!AC) return; if (curMusic && curMusic.name === n) return; const old = curMusic; curMusic = null;
  if (old) { old.g.gain.setTargetAtTime(0, AC.currentTime, .25); setTimeout(() => { try { old.s.stop(); } catch (e) {} }, 900); }
  if (!SND[n]) return; const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = SND[n]; s.loop = true; g.gain.value = 0; s.connect(g); g.connect(master); s.start(); g.gain.setTargetAtTime(muted ? 0 : .34, AC.currentTime, .4); curMusic = { name: n, s, g };
}
function stopMusic() { wantMusic = null; if (curMusic) { const o = curMusic; curMusic = null; o.g.gain.setTargetAtTime(0, AC.currentTime, .2); setTimeout(() => { try { o.s.stop(); } catch (e) {} }, 700); } }
function startLoop(n, vol) { if (loopSrc[n]) return; const s = snd(n, vol, 1, true); if (s) loopSrc[n] = s; }
function stopLoop(n) { const s = loopSrc[n]; if (s) { try { s.stop(); } catch (e) {} delete loopSrc[n]; } }
function tone(f, d, type = 'square', v = .1, to = null, delay = 0) { if (!AC || muted) return; const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(master || AC.destination); o.start(t); o.stop(t + d + .02); }
function noise(d, v = .15) { if (!AC || muted) return; const n = AC.sampleRate * d, b = AC.createBuffer(1, n, AC.sampleRate), a = b.getChannelData(0); for (let i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / n); const s = AC.createBufferSource(), g = AC.createGain(); s.buffer = b; g.gain.value = v; s.connect(g); g.connect(master || AC.destination); s.start(); }
let shotAt = 0;
const sfx = {
  shoot: () => { const t = performance.now(); if (t - shotAt < 70) return; shotAt = t; snd('shoot', .3, rnd(.95, 1.08)) || tone(880, .09, 'square', .06, 220); },
  boom: () => snd('explode', .55, rnd(.9, 1.15)) || (noise(.35, .2), tone(160, .3, 'sawtooth', .1, 40)),
  big: () => snd('boom', .9) || (noise(1, .3), tone(100, 1, 'sawtooth', .15, 30)),
  hit: () => snd('hit', .4, rnd(.9, 1.2)) || tone(300, .08, 'square', .08, 200),
  bosshit: () => snd('bosshit', .35, rnd(.9, 1.1)) || tone(180, .08, 'square', .08, 120),
  dive: () => snd('dive', .4, rnd(.9, 1.2)) || tone(500, .5, 'sawtooth', .05, 160),
  die: () => snd('die', .9) || (noise(.8, .3), tone(300, .8, 'sawtooth', .15, 30)),
  life: () => snd('rescue', .7) || [523, 659, 784, 1047].forEach((f, i) => tone(f, .14, 'square', .08, null, i * .1)),
  stage: () => snd('stage', .7) || [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'triangle', .1, null, i * .09)),
  enemyShot: () => snd('eshot', .3, rnd(.9, 1.15)) || tone(260, .12, 'sawtooth', .04, 120),
  capture: () => snd('capture', .8) || tone(900, 1, 'sine', .12, 200),
  rescue: () => snd('rescue', .9) || [523, 659, 784, 1047].forEach((f, i) => tone(f, .14, 'square', .08, null, i * .1)),
  power: () => snd('powerup', .7) || tone(600, .2, 'square', .08, 1200),
  bomb: () => snd('bomb', .9) || (noise(1, .3), tone(80, 1, 'sawtooth', .2, 30)),
  shield: () => snd('shield', .7) || tone(1200, .15, 'triangle', .1, 400),
  perfect: () => snd('perfect', .9) || [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .2, 'triangle', .1, null, i * .1)),
  warning: () => snd('warning', .8) || tone(400, 1, 'square', .1, 600),
  voice: n => snd('v_' + n, 1)
};

// ---------- state
let state = 'title', mode = 'normal', score = 0, hi = 0, lives = 3, stage = 1, time = 0, nextLife = 20000, banner = 0, bannerText = '', shake = 0, flash = 0;
try { hi = +localStorage.getItem('galactica-hi') || 0; } catch (e) {}
const ship = { x: W / 2, y: H - 70, alive: true, respawn: 0, inv: 0, cool: 0, dual: false, captured: null, capT: 0, capFrom: [0, 0], shield: 0 };
const pw = { spread: 0, rapid: 0 };
let enemies = [], bullets = [], ebullets = [], parts = [], texts = [], stars = [], drops = [], freed = null, boss = null, chal = null;
let formT = 0, formReady = false, diveT = 2, enterT = 0, mouse = { x: W / 2, in: false, down: false }, touch = { id: null, lastX: 0 }, keys = {};
for (let i = 0; i < 90; i++) stars.push({ x: rnd(0, W), y: rnd(0, H), z: rnd(.3, 1.2) });
const TYPES = { bee: { c: '#5ff0ff', hp: 1, pf: 50, pd: 100 }, butterfly: { c: '#ff6ad5', hp: 1, pf: 80, pd: 160 }, boss: { c: '#7dff6a', hp: 2, pf: 150, pd: 400 } };
const COLS = 10, DX = 40, DY = 38, FY = 112;
const formBreath = () => formReady ? Math.sin(formT * .9) * .5 + .5 : 0;
const slotX = e => W / 2 + (e.col - (COLS - 1) / 2) * DX * (1 + formBreath() * .08) + (formReady ? Math.sin(formT * .6) * 26 : 0);
const slotY = e => FY + e.row * DY * (1 + formBreath() * .06);
const stageType = n => n % 5 === 0 ? 'boss' : n % 3 === 0 ? 'challenge' : 'normal';
const wings = () => ship.dual ? [ship.x - 15, ship.x + 15] : [ship.x];

// ---------- paths: smooth curves travelled at constant speed
function spline(pts, seg = 14) {
  const out = []; const P = i => pts[clamp(i, 0, pts.length - 1)];
  for (let i = 0; i < pts.length - 1; i++) for (let k = 0; k < seg; k++) {
    const t = k / seg, a = P(i - 1), b = P(i), c = P(i + 1), d = P(i + 2), t2 = t * t, t3 = t2 * t;
    out.push([.5 * ((2 * b[0]) + (-a[0] + c[0]) * t + (2 * a[0] - 5 * b[0] + 4 * c[0] - d[0]) * t2 + (-a[0] + 3 * b[0] - 3 * c[0] + d[0]) * t3), .5 * ((2 * b[1]) + (-a[1] + c[1]) * t + (2 * a[1] - 5 * b[1] + 4 * c[1] - d[1]) * t2 + (-a[1] + 3 * b[1] - 3 * c[1] + d[1]) * t3)]);
  }
  out.push(pts[pts.length - 1]); let L = 0; const cum = [0]; for (let i = 1; i < out.length; i++) { L += Math.hypot(out[i][0] - out[i - 1][0], out[i][1] - out[i - 1][1]); cum.push(L); }
  return { pts: out, cum, len: L };
}
function onPath(p, d) { d = clamp(d, 0, p.len); let lo = 0, hi2 = p.cum.length - 1; while (lo < hi2 - 1) { const m = (lo + hi2) >> 1; if (p.cum[m] <= d) lo = m; else hi2 = m; } const a = p.pts[lo], b = p.pts[Math.min(lo + 1, p.pts.length - 1)], seg = p.cum[Math.min(lo + 1, p.cum.length - 1)] - p.cum[lo] || 1, k = (d - p.cum[lo]) / seg; return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, Math.atan2(b[1] - a[1], b[0] - a[0])]; }
function entryPath(kind, slot) {
  const m = kind % 2 ? -1 : 1;
  if (kind < 2) return spline([[W * (m > 0 ? .35 : .65), -30], [W * (m > 0 ? .35 : .65), 250], [W * (m > 0 ? .12 : .88), 360], [W * (m > 0 ? .3 : .7), 440], [W * (m > 0 ? .52 : .48), 340], slot]);
  return spline([[m > 0 ? -30 : W + 30, 470], [W * (m > 0 ? .3 : .7), 430], [W * .5, 300], [W * (m > 0 ? .3 : .7), 220], [W * (m > 0 ? .15 : .85), 330], slot]);
}
function chalPath(k, mir) { const f = x => mir ? W - x : x;
  const T = [[[.2 * W, -30], [.2 * W, 200], [.7 * W, 330], [.3 * W, 450], [.8 * W, 600], [.9 * W, H + 40]], [[-30, 200], [.55 * W, 230], [.8 * W, 330], [.5 * W, 430], [.25 * W, 330], [.5 * W, 230], [.5 * W, H + 40]], [[.5 * W, -30], [.5 * W, 150], [.15 * W, 300], [.85 * W, 450], [.5 * W, H + 40]]][k % 3];
  return spline(T.map(p => [f(p[0]), p[1]]));
}

// ---------- stages
function mkEnemy(type, row, col, g) { const e = { type, row, col, hp: TYPES[type].hp, x: -50, y: -50, state: 'wait', g, ang: Math.PI / 2, flap: rnd(0, 6), path: null, d: 0, shots: 0, captive: false }; enemies.push(e); return e; }
function clearField() { enemies = []; ebullets = []; drops = []; freed = null; boss = null; chal = null; formReady = false; formT = 0; diveT = 3; enterT = 0; stopLoop('beam'); }
function spawnWave() {
  clearField(); mode = 'normal'; const cols = (a, b) => { const r = []; for (let c = a; c <= b; c++) r.push(c); return r; };
  const g0 = [], g1 = [], g2 = [], g3 = [];
  cols(3, 6).forEach(c => g0.push(mkEnemy('boss', 0, c, 0))); cols(1, 4).forEach(c => g0.push(mkEnemy('butterfly', 1, c, 0)));
  cols(5, 8).forEach(c => g1.push(mkEnemy('butterfly', 1, c, 1))); cols(1, 8).forEach(c => g1.push(mkEnemy('butterfly', 2, c, 1)));
  cols(0, 9).forEach(c => g2.push(mkEnemy('bee', 3, c, 2))); cols(0, 9).forEach(c => g3.push(mkEnemy('bee', 4, c, 3)));
  [g0, g1, g2, g3].forEach((grp, gi) => grp.forEach((e, i) => { e.delay = gi * 3.2 + i * .17; }));
  playMusic('m_play'); bannerText = 'STAGE ' + stage; banner = 2.2; sfx.stage(); if (stage === 1) setTimeout(() => sfx.voice('ready'), 700);
}
function spawnChallenge() {
  clearField(); mode = 'challenge'; chal = { hits: 0, total: 40, done: 0, result: 0 };
  for (let g = 0; g < 5; g++) for (let i = 0; i < 8; i++) { const e = mkEnemy(g % 2 ? 'butterfly' : 'bee', 0, 0, g); e.delay = g * 2.5 + i * .17; e.cpath = chalPath(g, g % 2); e.chal = true; }
  playMusic('m_challenge'); bannerText = 'CHALLENGING STAGE'; banner = 2.6; sfx.stage(); setTimeout(() => sfx.voice('challenge'), 500);
}
const BOSSES = [{ name: 'MOTHERSHIP', c: '#ff5a5a' }, { name: 'HIVE QUEEN', c: '#c58bff' }, { name: 'DREAD CORE', c: '#ffb84d' }];
function spawnBoss() {
  clearField(); mode = 'boss'; const k = (stage / 5 - 1) | 0, def = BOSSES[k % 3], hp = 50 + 22 * k;
  boss = { x: W / 2, y: -120, hp, hpMax: hp, def, k, entered: false, vx: 70, shotT: 2, minT: 5, ang: 0, t: 0, warn: 2.6, dead: 0 };
  playMusic('m_boss'); bannerText = 'WARNING'; banner = 2.6; sfx.warning(); setTimeout(() => sfx.voice('boss'), 600);
}
function beginStage() { const t = stageType(stage); if (t === 'boss') spawnBoss(); else if (t === 'challenge') spawnChallenge(); else spawnWave(); }
function startGame() {
  score = 0; lives = 3; stage = 1; nextLife = 20000; bullets = []; parts = []; texts = []; ship.alive = true; ship.inv = 2; ship.x = W / 2; ship.dual = false; ship.captured = null; ship.shield = 0; pw.spread = pw.rapid = 0; state = 'play'; beginStage();
}

// ---------- helpers
function boom(x, y, n, col, sp = 180) { for (let i = 0; i < n; i++) { const a = rnd(0, TAU), v = rnd(.2, 1) * sp; parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(.3, .8), col }); } }
function pts(n, x, y) { score += n; texts.push({ x, y, t: .8, s: String(n) }); if (score >= nextLife) { nextLife += nextLife < 70000 ? 50000 : 70000; lives++; sfx.life(); texts.push({ x: W / 2, y: H / 2, t: 1.6, s: 'EXTRA SHIP' }); } if (score > hi) hi = score; }
function startDive(e) {
  e.state = 'dive'; const dir = e.x < ship.x ? -1 : 1; e.shots = 0; e.shotAt = [rnd(.25, .4), rnd(.55, .7)];
  e.path = spline([[e.x, e.y], [e.x + dir * 90, e.y + 90], [ship.x - dir * 110, H * .52], [ship.x + dir * 20, H * .8], [ship.x + dir * 60, H + 50]]); e.d = 0; e.spd = 260 + stage * 14; sfx.dive();
}
function startCapture(e) { const dir = e.x < ship.x ? -1 : 1; e.state = 'capdive'; e.path = spline([[e.x, e.y], [e.x + dir * 80, e.y + 70], [clamp(ship.x, 60, W - 60), H * .46]]); e.d = 0; e.bt = 0; sfx.dive(); }
function enemyFire(e) { if (ebullets.length >= 3 + Math.floor(stage / 2)) return; const a = Math.atan2(ship.y - e.y, ship.x - e.x), v = 230 + stage * 8; ebullets.push({ x: e.x, y: e.y + 10, vx: Math.cos(a) * v * .6, vy: Math.max(120, Math.sin(a) * v) }); sfx.enemyShot(); }
function killShip() {
  if (!ship.alive || ship.inv > 0 || ship.captured) return;
  if (ship.shield > 0) { ship.shield = 0; ship.inv = 1.2; flash = .25; sfx.shield(); boom(ship.x, ship.y, 20, '#5ff0ff', 200); return; }
  if (ship.dual) { ship.dual = false; ship.inv = 1.6; boom(ship.x + 15, ship.y, 30, '#fff', 220); sfx.die(); shake = .4; return; }
  ship.alive = false; boom(ship.x, ship.y, 50, '#fff', 260); boom(ship.x, ship.y, 30, '#5ff0ff', 200); sfx.die(); shake = .6; lives--; ship.respawn = 1.8; pw.spread = pw.rapid = 0;
  if (lives <= 0) setTimeout(() => sfx.voice('over'), 900);
}
function hitShip(x, y, r) { for (const wx of wings()) if (Math.hypot(x - wx, y - ship.y) < r) return true; return false; }
function dropPower(x, y, chance) {
  if (Math.random() > chance) return; const t = ['S', 'R', 'P', 'B'][Math.random() * 4 | 0]; drops.push({ x, y, t, ph: rnd(0, 6) });
}
const PCOL = { S: '#ffe066', R: '#ff9a4d', P: '#5ff0ff', B: '#ff5a5a' };
function givePower(t) {
  sfx.power(); const nm = { S: 'TRIPLE SHOT', R: 'RAPID FIRE', P: 'SHIELD', B: 'SMART BOMB' }[t]; texts.push({ x: ship.x, y: ship.y - 40, t: 1.4, s: nm });
  if (t === 'S') pw.spread = 14; else if (t === 'R') pw.rapid = 14; else if (t === 'P') ship.shield = 18;
  else { sfx.bomb(); flash = .6; shake = .5; ebullets = []; for (const e of enemies) { if (e.state === 'wait') continue; e.hp -= 1; if (e.hp <= 0) killEnemy(e, true); } if (boss && boss.entered) damageBoss(10); }
}
function killEnemy(e, byBomb) {
  const tp = TYPES[e.type]; pts(chal ? 100 : (e.state === 'form' ? tp.pf : tp.pd), e.x, e.y); boom(e.x, e.y, 22, tp.c); sfx.boom();
  if (chal) chal.hits++; else dropPower(e.x, e.y, e.state === 'form' ? .07 : .2);
  if (e.captive) { freed = { x: e.x, y: e.y - 20, spin: 0, vy: 90 }; e.captive = false; if (ship.captured === e) { /* rescued mid-pull */ ship.captured = null; ship.alive = true; ship.inv = 1.5; lives++; freed = null; sfx.rescue(); } }
  if (e.state === 'beam') stopLoop('beam');
  e.hp = 0;
}
function damageBoss(n) { if (!boss || boss.dead) return; boss.hp -= n; sfx.bosshit(); flash = Math.max(flash, .05); if (boss.hp <= 0) { boss.dead = 1; boss.hp = 0; ebullets = []; sfx.big(); sfx.voice('bossdown'); shake = 1; const bonus = 5000 * (boss.k + 1); pts(bonus, boss.x, boss.y); dropPower(boss.x - 30, boss.y, 1); dropPower(boss.x + 30, boss.y, 1); for (let i = 0; i < 10; i++) setTimeout(() => { if (boss) boom(boss.x + rnd(-60, 60), boss.y + rnd(-30, 30), 30, boss.def.c, 260); }, i * 150); } }

// ---------- update
function update(dt) {
  time += dt; if (banner > 0) banner -= dt; if (shake > 0) shake -= dt; if (flash > 0) flash -= dt;
  for (const s of stars) { s.y += s.z * 60 * dt; if (s.y > H) { s.y = 0; s.x = rnd(0, W); } }
  for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; } parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.t -= dt; t.y -= 24 * dt; } texts = texts.filter(t => t.t > 0);
  if (state !== 'play') return;
  if (pw.spread > 0) pw.spread -= dt; if (pw.rapid > 0) pw.rapid -= dt; if (ship.shield > 0) ship.shield -= dt;
  // ship
  if (ship.captured) {
    ship.capT += dt; const e = ship.captured, k = Math.min(1, ship.capT / 1.4); ship.x = ship.capFrom[0] + (e.x - ship.capFrom[0]) * k; ship.y = ship.capFrom[1] + (e.y + 34 - ship.capFrom[1]) * k;
    if (k >= 1) { ship.captured = null; e.bt = 99; e.state = 'return'; ship.respawn = 1.2; ship.alive = false; if (lives <= 0) setTimeout(() => sfx.voice('over'), 600); }
  } else if (ship.alive) {
    if (ship.inv > 0) ship.inv -= dt;
    let dx = 0; if (keys.ArrowLeft || keys.KeyA) dx -= 1; if (keys.ArrowRight || keys.KeyD) dx += 1;
    if (dx) ship.x += dx * 340 * dt; else if (mouse.in && touch.id === null) ship.x += (mouse.x - ship.x) * Math.min(1, 14 * dt);
    ship.x = clamp(ship.x, ship.dual ? 38 : 22, W - (ship.dual ? 38 : 22)); ship.y = H - 70;
    ship.cool -= dt; const fire = keys.Space || keys.ShiftLeft || keys.ShiftRight || mouse.down || touch.id !== null, cap = 6 + (ship.dual ? 4 : 0) + (pw.spread > 0 ? 8 : 0);
    if (fire && ship.cool <= 0 && bullets.length < cap) { for (const wx of wings()) { bullets.push({ x: wx, y: ship.y - 20, vx: 0 }); if (pw.spread > 0) { bullets.push({ x: wx, y: ship.y - 18, vx: -150 }); bullets.push({ x: wx, y: ship.y - 18, vx: 150 }); } } ship.cool = pw.rapid > 0 ? .1 : .2; sfx.shoot(); }
  } else if (ship.respawn > 0) { ship.respawn -= dt; if (ship.respawn <= 0) { if (lives <= 0) { state = 'over'; stopMusic(); stopLoop('beam'); try { localStorage.setItem('galactica-hi', String(hi)); } catch (e) {} return; } ship.alive = true; ship.inv = 2.5; ship.x = W / 2; ship.dual = false; ship.captured = null; } }
  for (let i = bullets.length - 1; i >= 0; i--) { const b = bullets[i]; b.y -= 720 * dt; b.x += b.vx * dt; if (b.y < -20 || b.x < -10 || b.x > W + 10) bullets.splice(i, 1); }
