<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  canvas { display:block; margin:0 auto; background:#000; max-width:100vw; max-height:100vh; }
</style>
</head>
<body>
<canvas id="c" width="960" height="720"></canvas>
<script>
// ===== Classic Asteroids (vector style) =====
// Controls: ←/→ rotate, ↑ thrust, SPACE fire, SHIFT/H hyperspace, ENTER start, P pause, M mute
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, TAU = Math.PI * 2;

// ---------- Audio (tiny WebAudio synth) ----------
let actx = null, muted = false;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return actx; }
function tone(freq, dur, type = 'square', vol = 0.08, slide = 0) {
  const a = audio(); if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
function noise(dur, vol = 0.15, freq = 800) {
  const a = audio(); if (!a || muted) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const sfx = {
  fire: () => tone(880, 0.12, 'square', 0.06, -600),
  ufoFire: () => tone(500, 0.15, 'sawtooth', 0.05, -300),
  boom: size => noise(size === 3 ? 0.5 : size === 2 ? 0.3 : 0.18, 0.2, size === 3 ? 400 : size === 2 ? 800 : 1500),
  shipBoom: () => noise(1.0, 0.3, 600),
  thrust: () => noise(0.08, 0.05, 300),
  extra: () => { tone(660, 0.1); setTimeout(() => tone(990, 0.2), 100); },
  hyper: () => tone(200, 0.3, 'sine', 0.1, 800),
};
// Classic two-note heartbeat that speeds up as asteroids dwindle
let beatT = 0, beatHi = false;
function heartbeat(dt) {
  if (state !== 'play' || !ship.alive) return;
  const total = rocks.length, interval = Math.max(0.28, 1.0 - (wave * 0.02) - Math.max(0, (12 - total)) * 0.04);
  beatT -= dt;
  if (beatT <= 0) { beatT = interval; beatHi = !beatHi; tone(beatHi ? 55 : 49, 0.12, 'triangle', 0.18); }
}

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) onPress(e.code);
  keys[e.code] = true;
});
addEventListener('keyup', e => keys[e.code] = false);
function onPress(code) {
  audio();
  if (code === 'KeyM') muted = !muted;
  if (code === 'KeyP' && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
  if ((code === 'Enter' || code === 'Space') && (state === 'title' || state === 'over')) newGame();
  if (state === 'play' && ship.alive) {
    if (code === 'Space') fire();
    if (code === 'ShiftLeft' || code === 'ShiftRight' || code === 'KeyH') hyperspace();
  }
}

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const wrap = o => { o.x = (o.x + W) % W; o.y = (o.y + H) % H; };
function wdist(a, b) { // shortest wrapped distance
  let dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y);
  if (dx > W / 2) dx = W - dx; if (dy > H / 2) dy = H - dy;
  return Math.hypot(dx, dy);
}

// ---------- Game state ----------
let state = 'title', score = 0, lives = 3, wave = 0, hi = +(localStorage.getItem('asteroids-hi') || 0);
let nextExtra = 10000, ship, rocks = [], bullets = [], ufoBullets = [], ufo = null, ufoTimer = 0, particles = [], debris = [];
let waveDelay = 0, respawnT = 0;

function makeShip() {
  return { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, alive: true, inv: 3, cool: 0, thrusting: false, r: 12 };
}
function newGame() {
  score = 0; lives = 3; wave = 0; nextExtra = 10000;
  rocks = []; bullets = []; ufoBullets = []; ufo = null; particles = []; debris = [];
  ship = makeShip(); state = 'play'; startWave();
}
function startWave() {
  wave++; const n = Math.min(4 + (wave - 1) * 2, 14);
  for (let i = 0; i < n; i++) {
    let x, y; do { x = rand(0, W); y = rand(0, H); } while (Math.hypot(x - W / 2, y - H / 2) < 180);
    rocks.push(makeRock(x, y, 3));
  }
  ufoTimer = rand(12, 20);
}
function makeRock(x, y, size) {
  const R = [0, 14, 28, 50][size], pts = [], n = 11;
  for (let i = 0; i < n; i++) pts.push([i / n * TAU, rand(0.7, 1.15) * R]);
  const sp = rand(30, 60) * (1 + (4 - size) * 0.35) * (1 + wave * 0.04), dir = rand(0, TAU);
  return { x, y, vx: Math.cos(dir) * sp, vy: Math.sin(dir) * sp, a: rand(0, TAU), spin: rand(-1, 1), size, r: R, pts };
}

// ---------- Actions ----------
function fire() {
  if (bullets.length >= 4) return;
  bullets.push({ x: ship.x + Math.cos(ship.a) * 14, y: ship.y + Math.sin(ship.a) * 14,
    vx: ship.vx + Math.cos(ship.a) * 520, vy: ship.vy + Math.sin(ship.a) * 520, life: 0.95 });
  sfx.fire();
}
function hyperspace() {
  sfx.hyper(); burst(ship.x, ship.y, 10, 120, '#fff');
  ship.x = rand(40, W - 40); ship.y = rand(40, H - 40); ship.vx = ship.vy = 0; ship.inv = 0.5;
  if (Math.random() < 0.15) killShip(); // classic risk
}
function burst(x, y, n, speed, color = '#fff') {
  for (let i = 0; i < n; i++) { const d = rand(0, TAU), s = rand(0.2, 1) * speed;
    particles.push({ x, y, vx: Math.cos(d) * s, vy: Math.sin(d) * s, life: rand(0.4, 1), color }); }
}
function addScore(p) {
  score += p;
  if (score >= nextExtra) { nextExtra += 10000; lives++; sfx.extra(); }
  if (score > hi) { hi = score; try { localStorage.setItem('asteroids-hi', hi); } catch (e) {} }
}
function killShip() {
  if (!ship.alive) return;
  ship.alive = false; sfx.shipBoom(); burst(ship.x, ship.y, 24, 180);
  for (let i = 0; i < 5; i++) { const d = rand(0, TAU);
    debris.push({ x: ship.x, y: ship.y, vx: Math.cos(d) * rand(20, 80) + ship.vx * 0.3, vy: Math.sin(d) * rand(20, 80) + ship.vy * 0.3,
      a: d, spin: rand(-6, 6), len: rand(8, 14), life: 2.2 }); }
  lives--; respawnT = 2.2;
}
function breakRock(i) {
  const r = rocks[i]; rocks.splice(i, 1);
  addScore([0, 100, 50, 20][r.size]); sfx.boom(r.size); burst(r.x, r.y, 6 + r.size * 3, 70 + r.size * 20);
  if (r.size > 1) for (let k = 0; k < 2; k++) { const c = makeRock(r.x, r.y, r.size - 1); rocks.push(c); }
}
function spawnUfo() {
  const small = score > 3000 && Math.random() < Math.min(0.9, 0.3 + score / 40000);
  const left = Math.random() < 0.5;
  ufo = { x: left ? -20 : W + 20, y: rand(60, H - 60), vx: (left ? 1 : -1) * (small ? 130 : 90), vy: 0, small, r: small ? 10 : 18, shoot: 1, turn: 1 };
}

// ---------- Update ----------
function update(dt) {
  // ship
  if (ship.alive) {
    if (keys.ArrowLeft) ship.a -= 4.2 * dt;
    if (keys.ArrowRight) ship.a += 4.2 * dt;
    ship.thrusting = !!keys.ArrowUp;
    if (ship.thrusting) { ship.vx += Math.cos(ship.a) * 260 * dt; ship.vy += Math.sin(ship.a) * 260 * dt;
      if (Math.random() < 0.5) sfx.thrust();
      particles.push({ x: ship.x - Math.cos(ship.a) * 10, y: ship.y - Math.sin(ship.a) * 10,
        vx: -Math.cos(ship.a) * 90 + rand(-25, 25), vy: -Math.sin(ship.a) * 90 + rand(-25, 25), life: 0.3, color: '#fff' }); }
    const drag = Math.pow(0.6, dt); ship.vx *= drag; ship.vy *= drag; // gentle friction
    const sp = Math.hypot(ship.vx, ship.vy); if (sp > 420) { ship.vx *= 420 / sp; ship.vy *= 420 / sp; }
    ship.x += ship.vx * dt; ship.y += ship.vy * dt; wrap(ship);
    if (ship.inv > 0) ship.inv -= dt;
  } else if (respawnT > 0) {
    respawnT -= dt;
    if (respawnT <= 0) {
      if (lives <= 0) { state = 'over'; }
      else if (rocks.every(r => wdist(r, { x: W / 2, y: H / 2 }) > 130)) { ship = makeShip(); }
      else respawnT = 0.1; // wait for safe space
    }
  }
  // rocks
  for (const r of rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.a += r.spin * dt; wrap(r); }
  // bullets
  for (let i = bullets.length - 1; i >= 0; i--) { const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; wrap(b); b.life -= dt; if (b.life <= 0) bullets.splice(i, 1); }
  for (let i = ufoBullets.length - 1; i >= 0; i--) { const b = ufoBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; wrap(b); b.life -= dt; if (b.life <= 0) ufoBullets.splice(i, 1); }
  // ufo
  if (!ufo && rocks.length) { ufoTimer -= dt; if (ufoTimer <= 0) { spawnUfo(); ufoTimer = rand(14, 24); } }
  if (ufo) {
    ufo.x += ufo.vx * dt; ufo.y += ufo.vy * dt; ufo.y = (ufo.y + H) % H;
    ufo.turn -= dt; if (ufo.turn <= 0) { ufo.turn = rand(0.8, 2); ufo.vy = pick([-70, 0, 70]); }
    ufo.shoot -= dt;
    if (ufo.shoot <= 0) { ufo.shoot = ufo.small ? 1.1 : 1.8;
      let ang = rand(0, TAU);
      if (ufo.small && ship.alive) ang = Math.atan2(ship.y - ufo.y, ship.x - ufo.x) + rand(-0.15, 0.15) * Math.max(0.2, 1 - score / 40000);
      ufoBullets.push({ x: ufo.x, y: ufo.y, vx: Math.cos(ang) * 260, vy: Math.sin(ang) * 260, life: 1.6 }); sfx.ufoFire(); }
    if (Math.random() < dt * 8) tone(ufo.small ? 900 : 500, 0.06, 'square', 0.03);
    if (ufo.x < -40 || ufo.x > W + 40) ufo = null;
  }
  // collisions: bullets vs rocks / ufo
  for (let i = bullets.length - 1; i >= 0; i--) { const b = bullets[i]; let hit = false;
    for (let j = rocks.length - 1; j >= 0; j--) if (wdist(b, rocks[j]) < rocks[j].r) { breakRock(j); hit = true; break; }
    if (!hit && ufo && wdist(b, ufo) < ufo.r + 3) { addScore(ufo.small ? 1000 : 200); sfx.boom(2); burst(ufo.x, ufo.y, 18, 130); ufo = null; hit = true; }
    if (hit) bullets.splice(i, 1); }
  // ufo bullets / ufo vs rocks
  if (ufo) for (let j = rocks.length - 1; j >= 0; j--) if (wdist(ufo, rocks[j]) < rocks[j].r + ufo.r) { breakRock(j); burst(ufo.x, ufo.y, 18, 130); ufo = null; break; }
  for (let i = ufoBullets.length - 1; i >= 0; i--) for (let j = rocks.length - 1; j >= 0; j--)
    if (wdist(ufoBullets[i], rocks[j]) < rocks[j].r) { rocks.splice(j, 1, ...[]); ufoBullets.splice(i, 1); sfx.boom(1); break; }
  // ship collisions
  if (ship.alive && ship.inv <= 0) {
    for (let j = rocks.length - 1; j >= 0; j--) if (wdist(ship, rocks[j]) < rocks[j].r + ship.r * 0.7) { breakRock(j); killShip(); break; }
    if (ship.alive && ufo && wdist(ship, ufo) < ufo.r + ship.r) { burst(ufo.x, ufo.y, 18, 130); ufo = null; killShip(); }
    if (ship.alive) for (let i = ufoBullets.length - 1; i >= 0; i--) if (wdist(ship, ufoBullets[i]) < ship.r) { ufoBullets.splice(i, 1); killShip(); break; }
  }
  // particles / debris
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) particles.splice(i, 1); }
  for (let i = debris.length - 1; i >= 0; i--) { const d = debris[i];
    d.x += d.vx * dt; d.y += d.vy * dt; d.a += d.spin * dt; d.life -= dt; if (d.life <= 0) debris.splice(i, 1); }
  // next wave
  if (!rocks.length && !ufo) { waveDelay += dt; if (waveDelay > 2) { waveDelay = 0; startWave(); } }
  heartbeat(dt);
}
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------- Render ----------
function poly(pts, close = true) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); if (close) ctx.closePath(); ctx.stroke(); }
// draw an object at wrapped positions so it appears on both edges
function ghosted(o, rad, fn) {
  for (const ox of [-W, 0, W]) for (const oy of [-H, 0, H]) {
    const x = o.x + ox, y = o.y + oy;
    if (x < -rad || x > W + rad || y < -rad || y > H + rad) continue;
    ctx.save(); ctx.translate(x, y); fn(); ctx.restore();
  }
}
function shipPath() { return [[16, 0], [-12, -10], [-7, 0], [-12, 10]]; }
function drawShip(x, y, a, thrust) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); poly(shipPath());
  if (thrust && Math.random() < 0.7) poly([[-8, -5], [-18 - Math.random() * 8, 0], [-8, 5]], false);
  ctx.restore();
}
function text(s, x, y, size, align = 'center') { ctx.font = `${size}px "Courier New", monospace`; ctx.textAlign = align; ctx.fillText(s, x, y); }

function render() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = ctx.fillStyle = '#fff'; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
  // HUD
  text(String(score).padStart(2, '0'), 120, 46, 36, 'right');
  text(String(hi).padStart(2, '0'), W / 2, 30, 18);
  for (let i = 0; i < Math.min(lives, 10); i++) drawShip(100 - i * 26 + 26, 76, -Math.PI / 2, false);

  for (const r of rocks) ghosted(r, r.r * 1.2, () => { ctx.rotate(r.a); poly(r.pts.map(([a, d]) => [Math.cos(a) * d, Math.sin(a) * d])); });
  for (const b of bullets) ghosted(b, 4, () => ctx.fillRect(-1.5, -1.5, 3, 3));
  ctx.fillStyle = '#fff';
  for (const b of ufoBullets) ghosted(b, 4, () => ctx.fillRect(-1.5, -1.5, 3, 3));
  if (ufo) ghosted(ufo, 30, () => { const s = ufo.small ? 0.55 : 1;
    ctx.scale(s, s);
    poly([[-18, 4], [-8, 12], [8, 12], [18, 4]]); poly([[-18, 4], [-8, -4], [8, -4], [18, 4]]);
    poly([[-8, -4], [-5, -12], [5, -12], [8, -4]]); });
  if (ship.alive && (ship.inv <= 0 || Math.floor(ship.inv * 10) % 2 === 0)) ghosted(ship, 30, () => { ctx.rotate(ship.a); poly(shipPath());
    if (ship.thrusting && Math.random() < 0.7) poly([[-8, -5], [-18 - Math.random() * 8, 0], [-8, 5]], false); });
  for (const d of debris) { ctx.globalAlpha = Math.min(1, d.life);
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.a); ctx.beginPath(); ctx.moveTo(-d.len / 2, 0); ctx.lineTo(d.len / 2, 0); ctx.stroke(); ctx.restore(); }
  for (const p of particles) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2)); ctx.fillRect(p.x, p.y, 2, 2); }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#fff';
  if (state === 'title') {
    text('ASTEROIDS', W / 2, H / 2 - 60, 72);
    text('PRESS ENTER OR SPACE TO START', W / 2, H / 2 + 10, 22);
    text('← → ROTATE   ↑ THRUST   SPACE FIRE   SHIFT HYPERSPACE', W / 2, H / 2 + 60, 16);
    text('P PAUSE   M MUTE', W / 2, H / 2 + 86, 16);
  } else if (state === 'over') {
    text('GAME OVER', W / 2, H / 2 - 10, 60);
    text('PRESS ENTER TO PLAY AGAIN', W / 2, H / 2 + 40, 20);
  } else if (state === 'pause') text('PAUSED', W / 2, H / 2, 48);
  else if (!rocks.length && !ufo && waveDelay > 0) text('WAVE ' + (wave + 1), W / 2, H / 2, 36);
}

// ---------- Loop ----------
// Demo field behind the title screen
ship = makeShip(); ship.alive = false; wave = 1; for (let i = 0; i < 6; i++) rocks.push(makeRock(rand(0, W), rand(0, H), 3));
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (state === 'play') update(dt);
  else if (state === 'title' || state === 'over') for (const r of rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.a += r.spin * dt; wrap(r); }
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
