<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asteroids</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  canvas { display:block; margin:0 auto; background:#000; max-width:100vw; max-height:100vh; }
</style>
</head>
<body>
<canvas id="c" width="960" height="720"></canvas>
<script>
// ===== Classic Asteroids (vector style) =====
// Controls: ←/→ rotate, ↑ thrust, SPACE fire, SHIFT/H hyperspace, ENTER start, P pause, M mute
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, TAU = Math.PI * 2;

// ---------- Audio (tiny WebAudio synth) ----------
let actx = null, muted = false;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return actx; }
function tone(freq, dur, type = 'square', vol = 0.08, slide = 0) {
  const a = audio(); if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
function noise(dur, vol = 0.15, freq = 800) {
  const a = audio(); if (!a || muted) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start();
}
const synth = {
  fire: () => tone(880, 0.12, 'square', 0.06, -600),
  ufoFire: () => tone(500, 0.15, 'sawtooth', 0.05, -300),
  boom: size => noise(size === 3 ? 0.5 : size === 2 ? 0.3 : 0.18, 0.2, size === 3 ? 400 : size === 2 ? 800 : 1500),
  shipBoom: () => noise(1.0, 0.3, 600),
  thrust: () => noise(0.08, 0.05, 300),
  extra: () => { tone(660, 0.1); setTimeout(() => tone(990, 0.2), 100); },
  hyper: () => tone(200, 0.3, 'sine', 0.1, 800),
};
// ---------- Recorded audio (ElevenLabs) with synth fallback ----------
// Files live in ./audio/sfx and ./audio/voice. Anything missing quietly falls back to the synth.
const SFX_FILES = ['laser','thrust','boom_large','boom_medium','boom_small','ship_boom','ufo_loop','ufo_fire','ufo_boom',
  'hyperspace','extra_life','alarm','coin','game_over','shield','radio','space_ambience'];
const VOICE_FILES = ['story1','story2','story3','story4','ctrl_contact','ctrl_ship_lost','ctrl_last_ship','ctrl_cleared',
  'ctrl_unidentified','ctrl_extra_ship','ctrl_all_lost','ann_title','ann_incoming','ann_extra_life','ann_game_over',
  'ann_insert_coin','ann_high_score','ann_hyperspace','ann_accelerating','ann_pilot_down',
  'alien_world_ends','alien_we_see_you','alien_earth_ours','alien_impossible'];
const clips = {};
for (const [dir, list] of [['sfx', SFX_FILES], ['voice', VOICE_FILES]]) for (const n of list) {
  const a = new Audio(`audio/${dir}/${n}.mp3`); a.preload = 'auto';
  a.addEventListener('canplaythrough', () => a._ok = true); a.addEventListener('error', () => a._bad = true);
  clips[n] = a;
}
function playClip(name, vol = 1) {
  const a = clips[name]; if (!a || !a._ok || muted) return false;
  const c = a.cloneNode(); c.volume = vol; c.play().catch(() => {}); return c;
}
const loops = {};
function loopSet(name, on, vol = 0.5) {
  const a = clips[name];
  if (!a || !a._ok) { if (name === 'thrust' && on && Math.random() < 0.5) synth.thrust(); return; }
  let l = loops[name]; if (!l) { l = loops[name] = a.cloneNode(); l.loop = true; l.volume = vol; }
  if (on && !muted) { if (l.paused) l.play().catch(() => {}); } else if (!l.paused) l.pause();
}
const sfx = {
  fire: () => playClip('laser', 0.45) || synth.fire(),
  ufoFire: () => playClip('ufo_fire', 0.6) || synth.ufoFire(),
  boom: s => playClip(s === 3 ? 'boom_large' : s === 2 ? 'boom_medium' : 'boom_small', 0.8) || synth.boom(s),
  ufoBoom: () => playClip('ufo_boom', 0.8) || synth.boom(2),
  shipBoom: () => playClip('ship_boom', 1) || synth.shipBoom(),
  extra: () => playClip('extra_life', 0.8) || synth.extra(),
  hyper: () => playClip('hyperspace', 0.7) || synth.hyper(),
  alarm: () => playClip('alarm', 0.5),
  shield: () => playClip('shield', 0.5),
  coin: () => playClip('coin', 0.8),
  gameOver: () => playClip('game_over', 0.8),
};
// Voice channel: one voice at a time; a new line only interrupts a lower-priority one. Always shows a subtitle.
let voice = null, voicePri = 0, subText = '', subT = 0;
function say(name, text, pri = 1) {
  if (voice && !voice.ended && !voice.paused && pri <= voicePri) return;
  if (voice) voice.pause();
  if (name.startsWith('ctrl_')) playClip('radio', 0.3);
  const c = playClip(name, 1); voice = c || null; voicePri = pri; subText = text;
  if (c) { subT = 60; c.onended = () => { if (voice === c) subT = 0.8; }; } else subT = 2 + text.length * 0.05;
}
// Opening story, spoken over deep-space ambience. Plays on its own timer if the voice files aren't there.
const STORY = [
  ['story1', 'The year is 2184. Beyond the orbit of Neptune, our deepest telescopes found something... moving in the dark.'],
  ['story2', 'A swarm. Ten thousand asteroids, tumbling out of the void... and every single one of them aimed at Earth.'],
  ['story3', 'There was no time to evacuate. No time to build a better defense. There was only one ship left in range. Yours.'],
  ['story4', 'Command has given you a name: the Last Line. Hold the field. Break the rock. Let nothing through. Earth is counting on you, pilot. Launch.'],
];
let st = { i: 0, t: 0, phase: 'gap', clip: null };
function startStory() { state = 'story'; st = { i: 0, t: 0, phase: 'gap', clip: null, min: 0 }; loopSet('space_ambience', true, 0.35); }
function endStory() { if (st.clip) st.clip.pause(); loopSet('space_ambience', false); fromRestart = false; newGame(); }
function updateStory(dt) {
  st.t += dt;
  if (st.phase === 'gap') {
    if (st.t > 1.0) { st.clip = playClip(STORY[st.i][0], 1); st.phase = 'speak'; st.t = 0; st.min = STORY[st.i][1].length * 0.065 + 1.5; }
  } else {
    const over = st.clip ? (st.clip.ended || st.t > 25) : st.t > st.min;
    if (over && st.t > 1.5) { st.i++; st.t = 0; st.phase = 'gap'; if (st.i >= STORY.length) endStory(); }
  }
}
function wrapText(str, x, y, maxW, lh, size) {
  ctx.font = `${size}px "Courier New", monospace`; ctx.textAlign = 'center';
  let line = '', row = 0; const lines = [];
  for (const w of str.split(' ')) { const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  lines.push(line); lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh));
}
function drawStory() {
  const entry = STORY[Math.min(st.i, STORY.length - 1)];
  ctx.globalAlpha = st.phase === 'speak' ? Math.min(1, st.t / 0.8) : Math.max(0, 1 - st.t / 0.4);
  wrapText(entry[1], W / 2, H / 2 - 40, W - 220, 36, 26);
  ctx.globalAlpha = 1; text('SPACE / ENTER TO SKIP', W / 2, H - 40, 14);
}
function gameOverSeq() {
  state = 'over'; playClip('m_gameover', 0.7) || sfx.gameOver(); say('ann_game_over', 'Game over. The field claims another.', 3);
  const newHigh = score > 0 && score > startHi;
  setTimeout(() => { if (state !== 'over') return;
    if (newHigh) { playClip('m_victory', 0.7); say('ann_high_score', 'New high score!', 2); }
    else say('ctrl_all_lost', 'CONTROL: All ships lost. Control signing off. Goodbye, pilot.', 2); }, 3200);
  setTimeout(() => { if (state === 'over') say('ann_insert_coin', 'Insert coin.', 1); }, 11000);
}

// ---------- Music (ElevenLabs) — crossfades by wave, ducks under voices ----------
for (const n of ['title', 'wave_early', 'gameplay', 'between_waves', 'boss', 'gameover', 'victory']) {
  const a = new Audio(`audio/music/${n}.mp3`); a.preload = 'auto';
  a.addEventListener('canplaythrough', () => a._ok = true); a.addEventListener('error', () => a._bad = true);
  clips['m_' + n] = a;
}
let musicCur = null; const musicEls = {};
function musicPick() {
  if (state === 'story') return 'title';
  if (state === 'play' || state === 'pause') {
    if (!rocks.length && !ufo) return 'between_waves';
    return wave >= 6 ? 'boss' : wave >= 4 ? 'gameplay' : 'wave_early';
  }
  return null;
}
function musicSet(name) {
  if (name === musicCur) return; musicCur = name;
  const a = name && clips['m_' + name]; if (!a || !a._ok) return;
  const e = musicEls[name] || (musicEls[name] = Object.assign(a.cloneNode(), { loop: true, volume: 0 }));
  if (e.paused) e.play().catch(() => {});
}
function musicTick(dt) {
  const talking = (voice && !voice.paused && !voice.ended) || (state === 'story' && st.clip && !st.clip.ended);
  for (const [name, e] of Object.entries(musicEls)) {
    const target = name === musicCur && !muted ? (talking ? 0.12 : 0.32) : 0;
    e.volume = Math.max(0, Math.min(1, e.volume + Math.max(-dt * 0.5, Math.min(dt * 0.5, target - e.volume))));
    if (target === 0 && e.volume === 0 && !e.paused) e.pause();
  }
}

// Classic two-note heartbeat that speeds up as asteroids dwindle
let beatT = 0, beatHi = false;
function heartbeat(dt) {
  if (state !== 'play' || !ship.alive || (musicCur && musicEls[musicCur])) return; // recorded music replaces the synth beat
  const total = rocks.length, interval = Math.max(0.28, 1.0 - (wave * 0.02) - Math.max(0, (12 - total)) * 0.04);
  beatT -= dt;
  if (beatT <= 0) { beatT = interval; beatHi = !beatHi; tone(beatHi ? 55 : 49, 0.12, 'triangle', 0.18); }
}

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) onPress(e.code);
  keys[e.code] = true;
});
addEventListener('keyup', e => keys[e.code] = false);
function onPress(code) {
  audio();
  if (code === 'KeyM') muted = !muted;
  if (code === 'KeyC') fx = !fx;
  if (code === 'KeyP' && (state === 'play' || state === 'pause')) state = state === 'play' ? 'pause' : 'play';
  if (code === 'Enter' || code === 'Space') {
    if (state === 'title') { sfx.coin(); startStory(); }
    else if (state === 'over') { sfx.coin(); fromRestart = true; newGame(); }
    else if (state === 'story') endStory();
  }
  if (state === 'play' && ship.alive) {
    if (code === 'Space') fire();
    if (code === 'ShiftLeft' || code === 'ShiftRight' || code === 'KeyH') hyperspace();
  }
}

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const wrap = o => { o.x = (o.x + W) % W; o.y = (o.y + H) % H; };
function wdist(a, b) { // shortest wrapped distance
  let dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y);
  if (dx > W / 2) dx = W - dx; if (dy > H / 2) dy = H - dy;
  return Math.hypot(dx, dy);
}

// ---------- Game state ----------
let state = 'title', score = 0, lives = 3, wave = 0, hi = +(localStorage.getItem('asteroids-hi') || 0);
let nextExtra = 10000, ship, rocks = [], bullets = [], ufoBullets = [], ufo = null, ufoTimer = 0, particles = [], debris = [];
let waveDelay = 0, respawnT = 0, startHi = 0, ufoSeen = 0, fromRestart = false;

function makeShip() {
  return { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, alive: true, inv: 3, cool: 0, thrusting: false, r: 12 };
}
function newGame() {
  score = 0; lives = 3; wave = 0; nextExtra = 10000;
  rocks = []; bullets = []; ufoBullets = []; ufo = null; particles = []; debris = [];
  startHi = hi; ufoSeen = 0; waveDelay = 0; voice = null; subT = 0;
  ship = makeShip(); state = 'play'; startWave();
}
function startWave() {
  wave++; const n = Math.min(4 + (wave - 1) * 2, 14);
  if (wave === 1) {
    if (fromRestart) say('ann_title', 'Asteroids. Survive the field.', 1);
    else say('ctrl_contact', 'CONTROL: Swarm contact in sixty seconds. Good hunting, pilot.', 1);
    fromRestart = false; }
  else { sfx.alarm();
    if (wave === 5 || wave === 8) say('ann_accelerating', 'Warning. The swarm is accelerating.', 1);
    else if (wave % 2 === 0) say('ann_incoming', 'Incoming. Brace yourself.', 1); }
  for (let i = 0; i < n; i++) {
    let x, y; do { x = rand(0, W); y = rand(0, H); } while (Math.hypot(x - W / 2, y - H / 2) < 180);
    rocks.push(makeRock(x, y, 3));
  }
  ufoTimer = rand(12, 20);
}
function makeRock(x, y, size) {
  const R = [0, 14, 28, 50][size], pts = [], n = 11;
  for (let i = 0; i < n; i++) pts.push([i / n * TAU, rand(0.7, 1.15) * R]);
  const sp = rand(30, 60) * (1 + (4 - size) * 0.35) * (1 + wave * 0.04), dir = rand(0, TAU);
  return { x, y, vx: Math.cos(dir) * sp, vy: Math.sin(dir) * sp, a: rand(0, TAU), spin: rand(-1, 1), size, r: R, pts };
}

// ---------- Actions ----------
function fire() {
  if (bullets.length >= 4) return;
  bullets.push({ x: ship.x + Math.cos(ship.a) * 14, y: ship.y + Math.sin(ship.a) * 14,
    vx: ship.vx + Math.cos(ship.a) * 520, vy: ship.vy + Math.sin(ship.a) * 520, life: 0.95 });
  sfx.fire();
}
function hyperspace() {
  sfx.hyper(); say('ann_hyperspace', 'Hyperspace engaged.', 1); burst(ship.x, ship.y, 10, 120, '#fff');
  ship.x = rand(40, W - 40); ship.y = rand(40, H - 40); ship.vx = ship.vy = 0; ship.inv = 0.5;
  if (Math.random() < 0.15) killShip(); // classic risk
}
function burst(x, y, n, speed, color = '#fff') {
  for (let i = 0; i < n; i++) { const d = rand(0, TAU), s = rand(0.2, 1) * speed;
    particles.push({ x, y, vx: Math.cos(d) * s, vy: Math.sin(d) * s, life: rand(0.4, 1), color }); }
}
function addScore(p) {
  score += p;
  if (score >= nextExtra) { nextExtra += 10000; lives++; sfx.extra();
    if (Math.random() < 0.5) say('ctrl_extra_ship', 'CONTROL: Extra ship authorized. Earth thanks you.', 2);
    else say('ann_extra_life', 'Extra life. Well played, pilot.', 2); }
  if (score > hi) { hi = score; try { localStorage.setItem('asteroids-hi', hi); } catch (e) {} }
}
function killShip() {
  if (!ship.alive) return;
  ship.alive = false; sfx.shipBoom(); burst(ship.x, ship.y, 40, 220, '#bff'); burst(ship.x, ship.y, 20, 140, '#fa4');
  shake = 22; flash = 0.8; ring(ship.x, ship.y, 160, '#bff'); ring(ship.x, ship.y, 90, '#fa4');
  for (let i = 0; i < 5; i++) { const d = rand(0, TAU);
    debris.push({ x: ship.x, y: ship.y, vx: Math.cos(d) * rand(20, 80) + ship.vx * 0.3, vy: Math.sin(d) * rand(20, 80) + ship.vy * 0.3,
      a: d, spin: rand(-6, 6), len: rand(8, 14), life: 2.2 }); }
  lives--; respawnT = 2.2;
  if (lives === 0) say('ann_pilot_down', 'Pilot down.', 2);
  else if (lives === 1) say('ctrl_last_ship', "CONTROL: Last ship. Pilot, you're all we have left.", 2);
  else say('ctrl_ship_lost', 'CONTROL: Ship destroyed! Deploying your backup. Stay sharp out there.', 2);
}
function breakRock(i) {
  const r = rocks[i]; rocks.splice(i, 1);
  addScore([0, 100, 50, 20][r.size]); sfx.boom(r.size); burst(r.x, r.y, 8 + r.size * 5, 80 + r.size * 25, rockColor());
  shake = Math.max(shake, [0, 2, 5, 9][r.size]); if (r.size >= 2) ring(r.x, r.y, 30 + r.size * 22, rockColor());
  if (r.size > 1) for (let k = 0; k < 2; k++) { const c = makeRock(r.x, r.y, r.size - 1); rocks.push(c); }
}
function spawnUfo() {
  const small = score > 3000 && Math.random() < Math.min(0.9, 0.3 + score / 40000);
  const left = Math.random() < 0.5;
  ufo = { x: left ? -20 : W + 20, y: rand(60, H - 60), vx: (left ? 1 : -1) * (small ? 130 : 90), vy: 0, small, r: small ? 10 : 18, shoot: 1, turn: 1 };
  if (ufoSeen++ === 0) say('ctrl_unidentified', 'CONTROL: Unidentified craft on radar. It is not ours. Repeat, not ours.', 2);
  else if (Math.random() < 0.7) {
    const [clip, line] = pick([['alien_world_ends', 'Your world ends today, little pilot.'], ['alien_we_see_you', 'We see you.'],
      ['alien_earth_ours', 'Earth will be ours.']]);
    say(clip, line, 2); }
}

// ---------- Update ----------
function update(dt) {
  // ship
  if (ship.alive) {
    if (keys.ArrowLeft) ship.a -= 4.2 * dt;
    if (keys.ArrowRight) ship.a += 4.2 * dt;
    ship.thrusting = !!keys.ArrowUp;
    if (ship.thrusting) { ship.vx += Math.cos(ship.a) * 260 * dt; ship.vy += Math.sin(ship.a) * 260 * dt;
      particles.push({ x: ship.x - Math.cos(ship.a) * 10, y: ship.y - Math.sin(ship.a) * 10,
        vx: -Math.cos(ship.a) * 90 + rand(-25, 25), vy: -Math.sin(ship.a) * 90 + rand(-25, 25), life: 0.3, color: '#fa4' }); }
    const drag = Math.pow(0.6, dt); ship.vx *= drag; ship.vy *= drag; // gentle friction
    const sp = Math.hypot(ship.vx, ship.vy); if (sp > 420) { ship.vx *= 420 / sp; ship.vy *= 420 / sp; }
    ship.x += ship.vx * dt; ship.y += ship.vy * dt; wrap(ship);
    if (ship.inv > 0) ship.inv -= dt;
  } else if (respawnT > 0) {
    respawnT -= dt;
    if (respawnT <= 0) {
      if (lives <= 0) gameOverSeq();
      else if (rocks.every(r => wdist(r, { x: W / 2, y: H / 2 }) > 130)) { ship = makeShip(); sfx.shield(); }
      else respawnT = 0.1; // wait for safe space
    }
  }
  // rocks
  for (const r of rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.a += r.spin * dt; wrap(r); }
  // bullets
  for (let i = bullets.length - 1; i >= 0; i--) { const b = bullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; wrap(b); b.life -= dt; if (b.life <= 0) bullets.splice(i, 1); }
  for (let i = ufoBullets.length - 1; i >= 0; i--) { const b = ufoBullets[i];
    b.x += b.vx * dt; b.y += b.vy * dt; wrap(b); b.life -= dt; if (b.life <= 0) ufoBullets.splice(i, 1); }
  // ufo
  if (!ufo && rocks.length) { ufoTimer -= dt; if (ufoTimer <= 0) { spawnUfo(); ufoTimer = rand(14, 24); } }
  if (ufo) {
    ufo.x += ufo.vx * dt; ufo.y += ufo.vy * dt; ufo.y = (ufo.y + H) % H;
    ufo.turn -= dt; if (ufo.turn <= 0) { ufo.turn = rand(0.8, 2); ufo.vy = pick([-70, 0, 70]); }
    ufo.shoot -= dt;
    if (ufo.shoot <= 0) { ufo.shoot = ufo.small ? 1.1 : 1.8;
      let ang = rand(0, TAU);
      if (ufo.small && ship.alive) ang = Math.atan2(ship.y - ufo.y, ship.x - ufo.x) + rand(-0.15, 0.15) * Math.max(0.2, 1 - score / 40000);
      ufoBullets.push({ x: ufo.x, y: ufo.y, vx: Math.cos(ang) * 260, vy: Math.sin(ang) * 260, life: 1.6 }); sfx.ufoFire(); }
    if (Math.random() < dt * 8) tone(ufo.small ? 900 : 500, 0.06, 'square', 0.03);
    if (ufo.x < -40 || ufo.x > W + 40) ufo = null;
  }
  // collisions: bullets vs rocks / ufo
  for (let i = bullets.length - 1; i >= 0; i--) { const b = bullets[i]; let hit = false;
    for (let j = rocks.length - 1; j >= 0; j--) if (wdist(b, rocks[j]) < rocks[j].r) { breakRock(j); hit = true; break; }
    if (!hit && ufo && wdist(b, ufo) < ufo.r + 3) { addScore(ufo.small ? 1000 : 200); sfx.ufoBoom(); say('alien_impossible', 'Impossible...', 2); burst(ufo.x, ufo.y, 30, 170, '#f4a'); burst(ufo.x, ufo.y, 12, 110, '#ff6'); shake = Math.max(shake, 10); ring(ufo.x, ufo.y, 100, '#f4a'); ufo = null; hit = true; }
    if (hit) bullets.splice(i, 1); }
  // ufo bullets / ufo vs rocks
  if (ufo) for (let j = rocks.length - 1; j >= 0; j--) if (wdist(ufo, rocks[j]) < rocks[j].r + ufo.r) { breakRock(j); burst(ufo.x, ufo.y, 18, 130); ufo = null; break; }
  for (let i = ufoBullets.length - 1; i >= 0; i--) for (let j = rocks.length - 1; j >= 0; j--)
    if (wdist(ufoBullets[i], rocks[j]) < rocks[j].r) { rocks.splice(j, 1, ...[]); ufoBullets.splice(i, 1); sfx.boom(1); break; }
  // ship collisions
  if (ship.alive && ship.inv <= 0) {
    for (let j = rocks.length - 1; j >= 0; j--) if (wdist(ship, rocks[j]) < rocks[j].r + ship.r * 0.7) { breakRock(j); killShip(); break; }
    if (ship.alive && ufo && wdist(ship, ufo) < ufo.r + ship.r) { burst(ufo.x, ufo.y, 18, 130); ufo = null; killShip(); }
    if (ship.alive) for (let i = ufoBullets.length - 1; i >= 0; i--) if (wdist(ship, ufoBullets[i]) < ship.r) { ufoBullets.splice(i, 1); killShip(); break; }
  }
  // particles / debris
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) particles.splice(i, 1); }
  for (let i = debris.length - 1; i >= 0; i--) { const d = debris[i];
    d.x += d.vx * dt; d.y += d.vy * dt; d.a += d.spin * dt; d.life -= dt; if (d.life <= 0) debris.splice(i, 1); }
  // next wave
  if (!rocks.length && !ufo) {
    if (waveDelay === 0 && ship.alive) say('ctrl_cleared', 'CONTROL: Field cleared. Nice shooting. Stand by for the next contact.', 1);
    waveDelay += dt; if (waveDelay > 3.5) { waveDelay = 0; startWave(); } }
  loopSet('thrust', ship.alive && ship.thrusting, 0.4);
  loopSet('ufo_loop', !!ufo, 0.25);
  heartbeat(dt);
}
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------- Render ----------
function poly(pts, close = true) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); if (close) ctx.closePath(); ctx.stroke(); }
// draw an object at wrapped positions so it appears on both edges
function ghosted(o, rad, fn) {
  for (const ox of [-W, 0, W]) for (const oy of [-H, 0, H]) {
    const x = o.x + ox, y = o.y + oy;
    if (x < -rad || x > W + rad || y < -rad || y > H + rad) continue;
    ctx.save(); ctx.translate(x, y); fn(); ctx.restore();
  }
}
function shipPath() { return [[16, 0], [-12, -10], [-7, 0], [-12, 10]]; }
function drawShip(x, y, a, thrust) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); poly(shipPath());
  if (thrust && Math.random() < 0.7) poly([[-8, -5], [-18 - Math.random() * 8, 0], [-8, 5]], false);
  ctx.restore();
}
function text(s, x, y, size, align = 'center') { ctx.font = `${size}px "Courier New", monospace`; ctx.textAlign = align; ctx.fillText(s, x, y); }

// ---------- Visual FX ----------
// Neon glow, parallax stars, shockwave rings, screen shake and CRT scanlines. Press C to toggle the effects.
let fx = true, shake = 0, flash = 0;
const rings = [];
function ring(x, y, max, color) { rings.push({ x, y, r: 4, max, color, life: 1 }); }
const stars = Array.from({ length: 150 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: 0.2 + Math.random() * 0.8, tw: Math.random() * TAU }));
function starsTick(dt) {
  const vx = state === 'play' && ship.alive ? ship.vx : 0, vy = state === 'play' && ship.alive ? ship.vy : 0;
  for (const s of stars) { s.x = (s.x - vx * s.z * 0.12 * dt - s.z * 6 * dt + W) % W; s.y = (s.y - vy * s.z * 0.12 * dt + H) % H; s.tw += dt * (1 + s.z * 2); }
  for (let i = rings.length - 1; i >= 0; i--) { const g = rings[i]; g.r += (g.max - g.r) * Math.min(1, dt * 5) + dt * 30; g.life -= dt * 1.6; if (g.life <= 0) rings.splice(i, 1); }
  shake = Math.max(0, shake - 45 * dt); flash = Math.max(0, flash - dt * 1.8);
}
// pre-rendered scanlines + vignette
const crt = document.createElement('canvas'); crt.width = W; crt.height = H;
(() => {
  const c = crt.getContext('2d');
  c.fillStyle = 'rgba(0,0,0,0.22)'; for (let y = 0; y < H; y += 3) c.fillRect(0, y, W, 1);
  const g = c.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 0.9);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)'); c.fillStyle = g; c.fillRect(0, 0, W, H);
})();
function neon(color, blur) { ctx.strokeStyle = ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = fx ? blur : 0; }
const rockColor = () => `hsl(${(wave * 47 + 190) % 360},100%,66%)`; // each wave gets its own hue

function render() {
  const t = performance.now() / 1000, rc = rockColor();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  ctx.fillStyle = fx ? '#03040d' : '#000'; ctx.fillRect(0, 0, W, H);
  if (fx) for (const s of stars) { ctx.globalAlpha = (0.35 + 0.35 * Math.sin(s.tw)) * s.z; ctx.fillStyle = '#cfe'; ctx.fillRect(s.x, s.y, s.z * 2, s.z * 2); }
  ctx.globalAlpha = 1;

  ctx.save();
  if (fx && shake > 0.3) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (state !== 'story') { // HUD
    neon('#9ef', 10);
    text(String(score).padStart(2, '0'), 120, 46, 36, 'right');
    neon('#fc6', 8); text(String(hi).padStart(2, '0'), W / 2, 30, 18);
    neon('#bff', 10); for (let i = 0; i < Math.min(lives, 10); i++) drawShip(100 - i * 26 + 26, 76, -Math.PI / 2, false);
  }
  neon(rc, 12);
  for (const r of rocks) ghosted(r, r.r * 1.2, () => { ctx.rotate(r.a); poly(r.pts.map(([a, d]) => [Math.cos(a) * d, Math.sin(a) * d])); });
  neon('#ff7', 14);
  for (const b of bullets) ghosted(b, 12, () => { ctx.fillRect(-2, -2, 4, 4); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-b.vx * 0.025, -b.vy * 0.025); ctx.stroke(); });
  neon('#f55', 12);
  for (const b of ufoBullets) ghosted(b, 8, () => ctx.fillRect(-2, -2, 4, 4));
  if (ufo) ghosted(ufo, 30, () => { const s = ufo.small ? 0.55 : 1; ctx.scale(s, s);
    neon('#f4a', 16);
    poly([[-18, 4], [-8, 12], [8, 12], [18, 4]]); poly([[-18, 4], [-8, -4], [8, -4], [18, 4]]);
    poly([[-8, -4], [-5, -12], [5, -12], [8, -4]]);
    for (let k = -1; k <= 1; k++) { ctx.fillStyle = (Math.floor(t * 6) + k) % 2 ? '#ff6' : '#f4a'; ctx.fillRect(k * 9 - 1.5, 5, 3, 3); } });
  if (ship.alive && (ship.inv <= 0 || Math.floor(ship.inv * 10) % 2 === 0)) ghosted(ship, 30, () => {
    ctx.rotate(ship.a); neon('#bff', 16); poly(shipPath());
    if (ship.thrusting && Math.random() < 0.8) { neon('#fa3', 18); poly([[-8, -5], [-18 - Math.random() * 10, 0], [-8, 5]], false); } });
  if (ship.alive && ship.inv > 0) { neon('#6cf', 14); ctx.globalAlpha = Math.min(1, ship.inv) * 0.6;
    ghosted(ship, 30, () => { ctx.beginPath(); ctx.arc(0, 0, 22, 0, TAU); ctx.stroke(); }); ctx.globalAlpha = 1; }
  neon('#bff', 8);
  for (const d of debris) { ctx.globalAlpha = Math.min(1, d.life);
    ctx.save(); ctx.translate(d.x, d.y); ctx.rotate(d.a); ctx.beginPath(); ctx.moveTo(-d.len / 2, 0); ctx.lineTo(d.len / 2, 0); ctx.stroke(); ctx.restore(); }
  for (const g of rings) { ctx.globalAlpha = Math.max(0, g.life) * 0.8; neon(g.color, 14); ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, TAU); ctx.stroke(); }
  ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) { ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2)); ctx.fillStyle = p.color; ctx.fillRect(p.x - 1, p.y - 1, 3, 3); }
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.restore();

  // screens and messages (not shaken)
  const hue = (t * 40) % 360, title = `hsl(${hue},100%,72%)`;
  if (state === 'title') {
    neon(title, 24); text('ASTEROIDS', W / 2, H / 2 - 60, 76);
    neon('#fff', 10); text('PRESS ENTER OR SPACE TO START', W / 2, H / 2 + 10, 22);
    neon('#9ef', 6); text('← → ROTATE   ↑ THRUST   SPACE FIRE   SHIFT HYPERSPACE', W / 2, H / 2 + 60, 16);
    text('P PAUSE   M MUTE   C CRT EFFECTS', W / 2, H / 2 + 86, 16);
  } else if (state === 'over') {
    neon('#f55', 24); text('GAME OVER', W / 2, H / 2 - 10, 64);
    neon('#fff', 8); text('PRESS ENTER TO PLAY AGAIN', W / 2, H / 2 + 40, 20);
  } else if (state === 'story') { neon('#dff', 10); drawStory(); }
  else if (state === 'pause') { neon('#fff', 14); text('PAUSED', W / 2, H / 2, 48); }
  else if (!rocks.length && !ufo && waveDelay > 0) { neon(rc, 18); text('WAVE ' + (wave + 1), W / 2, H / 2, 40); }
  if (subT > 0 && state !== 'story') { // voice subtitles
    ctx.globalAlpha = Math.min(1, subT * 2); neon('#9fd', 8);
    wrapText(subText, W / 2, H - 70, W - 200, 26, 20); ctx.globalAlpha = 1; }
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff';

  if (fx) {
    if (flash > 0) { ctx.globalAlpha = flash * 0.5; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
    const band = ((t * 70) % (H + 240)) - 120; // slow rolling scan band
    const g = ctx.createLinearGradient(0, band - 60, 0, band + 60);
    g.addColorStop(0, 'rgba(160,220,255,0)'); g.addColorStop(0.5, 'rgba(160,220,255,0.035)'); g.addColorStop(1, 'rgba(160,220,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, band - 60, W, 120);
    ctx.drawImage(crt, 0, 0);
  }
}

// ---------- Loop ----------
// Demo field behind the title screen
ship = makeShip(); ship.alive = false; wave = 1; for (let i = 0; i < 6; i++) rocks.push(makeRock(rand(0, W), rand(0, H), 3));
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (state === 'play') update(dt);
  else {
    if (state === 'title' || state === 'over' || state === 'story') for (const r of rocks) { r.x += r.vx * dt; r.y += r.vy * dt; r.a += r.spin * dt; wrap(r); }
    if (state === 'story') updateStory(dt);
    if (state !== 'pause') { loopSet('thrust', false); loopSet('ufo_loop', false); }
  }
  if (subT > 0 && subT < 50) subT -= dt;
  musicSet(musicPick()); musicTick(dt); starsTick(dt);
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
